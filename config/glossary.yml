# Словарь профессиональных сокращений — данные страницы /glossary.
#
# Формат: ключ верхнего уровня = slug опубликованной профессии (группа на
# странице); внутри — записи по алфавиту (кириллица, затем латиница):
#   term:   само сокращение, как его пишут в документах
#   full:   расшифровка
#   note:   одна строка пояснения — зачем это знать (не энциклопедия!)
#   lesson: slug урока, где термин разобран (опционально; если урок не найден
#           или не указан, страница подставит ссылку на поиск)
#   analog: аналог в другой системе обозначений (опционально): УЗО ≈ RCD.
#           Именно АНАЛОГ, не перевод — ставьте только честные пары; у ПУЭ
#           или НАКС аналога нет, и это нормально. Если аналог есть в словаре
#           своей записью, страница свяжет их якорем автоматически.
#
# Это справочные данные, не пользовательский контент: правка = коммит,
# история = git. Только сокращения и аббревиатуры — понятия объясняют уроки.

elektrik:
  - term: "АВ"
    full: "Автоматический выключатель"
    note: "Защищает линию от перегрузки и короткого замыкания; выбирается по номиналу и характеристике B/C/D."
    lesson: "01-avtomaticheskie-vyklyuchateli"
    analog: "MCB"
  - term: "АВДТ"
    full: "Автоматический выключатель дифференциального тока (дифавтомат)"
    note: "Автомат и УЗО в одном корпусе: защищает и линию, и человека."
    lesson: "02-uzo-i-difavtomaty"
    analog: "RCBO"
  - term: "АВР"
    full: "Автоматический ввод резерва"
    note: "Автоматически переключает питание на резервный источник при пропадании основного."
    lesson: "03-kategorii-nadezhnosti"
  - term: "ВВГнг(А)-LS"
    full: "Кабель с виниловой изоляцией, не распространяющий горение, с пониженным дымовыделением"
    note: "Основная марка медного кабеля для стационарной проводки в жилых зданиях."
    lesson: "01-marki-kabeley"
  - term: "ВЛ"
    full: "Воздушная линия электропередачи"
    note: "Провода на опорах; для ввода в частный дом обычно применяется СИП."
  - term: "ВРУ"
    full: "Вводно-распределительное устройство"
    note: "Главный щит здания: ввод, учёт и распределение энергии по стоякам и группам."
    lesson: "01-logika-komponovki-shchita"
  - term: "ГЗШ"
    full: "Главная заземляющая шина"
    note: "Шина, к которой сходятся заземляющие и защитные проводники здания; основа уравнивания потенциалов."
    lesson: "03-uravnivanie-potencialov"
  - term: "ГОСТ"
    full: "Государственный стандарт"
    note: "В электрике ГОСТы задают требования к маркировке, соединениям и испытаниям."
  - term: "ГРЩ"
    full: "Главный распределительный щит"
    note: "Щит, с которого начинается распределение электроэнергии по зданию."
    lesson: "01-logika-komponovki-shchita"
  - term: "ДСУП"
    full: "Дополнительная система уравнивания потенциалов"
    note: "Обязательна в ванных: соединяет проводящие части помещения между собой и с защитным проводником."
    lesson: "03-uravnivanie-potencialov"
  - term: "ЗУ"
    full: "Заземляющее устройство"
    note: "Заземлитель в грунте плюс заземляющие проводники; его сопротивление нормируется и измеряется."
    lesson: "03-soprotivlenie-zazemleniya"
  - term: "КЗ"
    full: "Короткое замыкание"
    note: "Аварийное соединение проводников с малым сопротивлением; ожидаемый ток КЗ определяет выбор защиты."
    lesson: "01-avtomaticheskie-vyklyuchateli"
  - term: "КИП"
    full: "Контрольно-измерительные приборы"
    note: "Мультиметры, токовые клещи, мегаомметры — всё, чем электрик измеряет."
    lesson: "02-multimetr-i-kleshchi"
  - term: "КЛ"
    full: "Кабельная линия электропередачи"
    note: "Линия из кабелей в земле, трубах или кабельных сооружениях."
  - term: "ЛЭП"
    full: "Линия электропередачи"
    note: "Общее название линий передачи электроэнергии — воздушных (ВЛ) и кабельных (КЛ)."
  - term: "НКУ"
    full: "Низковольтное комплектное устройство"
    note: "Заводское название щитов и распределительных сборок на напряжение до 1000 В."
    lesson: "01-logika-komponovki-shchita"
  - term: "ПВС"
    full: "Провод виниловый соединительный"
    note: "Гибкий провод для переносных приборов и удлинителей; для стационарной проводки не применяется."
    lesson: "01-marki-kabeley"
  - term: "ПОТЭЭ"
    full: "Правила по охране труда при эксплуатации электроустановок"
    note: "Откуда берутся группы допуска, наряды и организационные меры безопасности."
    lesson: "01-gruppy-elektrobezopasnosti"
  - term: "ППР"
    full: "Планово-предупредительный ремонт"
    note: "Обслуживание оборудования по графику, а не по факту поломки."
    lesson: "01-operativnye-obkhody-i-zhurnal"
  - term: "ПТЭЭП"
    full: "Правила технической эксплуатации электроустановок потребителей"
    note: "Как эксплуатировать электроустановки: персонал, документация, обслуживание (Приказ № 811)."
    lesson: "01-pteep-prikaz-811"
  - term: "ПУЭ"
    full: "Правила устройства электроустановок"
    note: "Главный документ электрика: как проектировать и монтировать электроустановки."
    lesson: "01-chto-takoe-pue"
  - term: "СИЗ"
    full: "Средства индивидуальной защиты"
    note: "Диэлектрические перчатки, боты, каска, очки — то, что защищает самого электрика."
    lesson: "01-siz-elektrika"
  - term: "СИП"
    full: "Самонесущий изолированный провод"
    note: "Изолированный провод для воздушных линий и вводов в дом; не требует несущего троса."
    lesson: "01-marki-kabeley"
  - term: "СЛР"
    full: "Сердечно-лёгочная реанимация"
    note: "Первая помощь при остановке сердца — обязательный навык для группы допуска."
    lesson: "03-osvobozhdenie-ot-toka-praktika"
  - term: "СНиП"
    full: "Строительные нормы и правила"
    note: "Старое название строительных норм; большинство заменено сводами правил (СП)."
  - term: "СП"
    full: "Свод правил"
    note: "Современный формат строительных норм; для электрики зданий ключевой — СП 256.1325800."
  - term: "СУП"
    full: "Система уравнивания потенциалов"
    note: "Соединяет проводящие части здания в единую сеть, чтобы между ними не возникала опасная разность потенциалов."
    lesson: "03-uravnivanie-potencialov"
  - term: "ТП"
    full: "Трансформаторная подстанция"
    note: "Понижает 6–10 кВ до 0,4 кВ и распределяет энергию потребителям."
    lesson: "03-trehfaznaya-set"
  - term: "УГО"
    full: "Условные графические обозначения"
    note: "Стандартные значки элементов на схемах — язык, на котором схемы читаются."
    lesson: "01-ugo-i-chtenie-shem"
  - term: "УЗИП"
    full: "Устройство защиты от импульсных перенапряжений"
    note: "Защищает электроустановку от грозовых и коммутационных импульсов."
    lesson: "03-uzip-i-rele-napryazheniya"
    analog: "SPD"
  - term: "УЗО"
    full: "Устройство защитного отключения"
    note: "Отключает питание при токе утечки; главная защита человека от поражения током."
    lesson: "02-uzo-i-difavtomaty"
    analog: "RCD"
  - term: "ЭДС"
    full: "Электродвижущая сила"
    note: "Характеристика источника питания: способность создавать ток в цепи; измеряется в вольтах."
    lesson: "01-zakon-oma-i-kirkhgofa"
    analog: "EMF"
  - term: "cos φ"
    full: "Коэффициент мощности"
    note: "Доля активной мощности в полной; важен при расчёте нагрузок и сечений."
    lesson: "01-moshchnost-p-q-s"
    analog: "PF"
  - term: "MCB"
    full: "Miniature Circuit Breaker"
    note: "Международное название модульного автоматического выключателя — на импортной аппаратуре и в даташитах."
    lesson: "01-avtomaticheskie-vyklyuchateli"
    analog: "АВ"
  - term: "N"
    full: "Нулевой рабочий проводник (нейтраль)"
    note: "По нему возвращается рабочий ток; маркируется голубым цветом."
    lesson: "02-sistemy-zazemleniya-tn-tt-it"
  - term: "PE"
    full: "Защитный проводник (Protective Earth)"
    note: "Соединяет корпуса оборудования с землёй; жёлто-зелёная маркировка, рабочий ток по нему не течёт."
    lesson: "02-sistemy-zazemleniya-tn-tt-it"
  - term: "PEN"
    full: "Совмещённый защитный и нулевой рабочий проводник"
    note: "Один проводник в роли PE и N (система TN-C); в современных установках разделяется на PE и N."
    lesson: "02-sistemy-zazemleniya-tn-tt-it"
  - term: "RCBO"
    full: "Residual Current Breaker with Overcurrent protection"
    note: "Международное название дифавтомата."
    lesson: "02-uzo-i-difavtomaty"
    analog: "АВДТ"
  - term: "RCD"
    full: "Residual Current Device"
    note: "Международное название УЗО — на корпусах импортных устройств и в англоязычной документации."
    lesson: "02-uzo-i-difavtomaty"
    analog: "УЗО"
  - term: "SPD"
    full: "Surge Protective Device"
    note: "Международное название УЗИП; классы испытаний I/II/III на корпусе."
    lesson: "03-uzip-i-rele-napryazheniya"
    analog: "УЗИП"
  - term: "TN, TT, IT"
    full: "Системы заземления"
    note: "Классификация по способу связи нейтрали источника и корпусов с землёй: TN-C, TN-S, TN-C-S, TT, IT."
    lesson: "02-sistemy-zazemleniya-tn-tt-it"

inzhener-asu-tp:
  - term: "АРМ"
    full: "Автоматизированное рабочее место"
    note: "Компьютер оператора со SCADA — верхний уровень системы управления."
    lesson: "scada-osnovy-tegi-arhitektura"
  - term: "АСУ ТП"
    full: "Автоматизированная система управления технологическим процессом"
    note: "Вся пирамида: датчики → контроллеры → SCADA; профессия крутится вокруг неё."
    lesson: "chto-takoe-asutp-urovni-struktura"
    analog: "ICS"
  - term: "ИМ"
    full: "Исполнительный механизм"
    note: "Клапан, привод, частотник — то, чем система действует на процесс."
    lesson: "ispolnitelnye-mehanizmy-i-chastotniki"
  - term: "КИПиА"
    full: "Контрольно-измерительные приборы и автоматика"
    note: "Полевой уровень: датчики, приборы и всё их обслуживание."
    lesson: "datchiki-davleniya-rashoda-urovnya"
    analog: "I&C"
  - term: "МЭК"
    full: "Международная электротехническая комиссия"
    note: "Стандарты МЭК задают языки ПЛК (61131-3) и функциональную безопасность (61508/61511)."
    lesson: "yazyki-mek-61131-3"
    analog: "IEC"
  - term: "ПАЗ"
    full: "Противоаварийная защита"
    note: "Отдельный контур, который останавливает процесс при выходе за опасные границы."
    lesson: "funkcionalnaya-bezopasnost-paz-sil"
    analog: "SIS"
  - term: "ПИД"
    full: "Пропорционально-интегрально-дифференциальный регулятор"
    note: "Базовый алгоритм автоматического регулирования — держит параметр на уставке."
    lesson: "pid-regulirovanie"
    analog: "PID"
  - term: "ПЛК"
    full: "Программируемый логический контроллер"
    note: "Промышленный компьютер, исполняющий программу управления циклом «опрос → логика → выход»."
    lesson: "chto-takoe-plk-cikl-skanirovaniya"
    analog: "PLC"
  - term: "ПНР"
    full: "Пусконаладочные работы"
    note: "Этап между монтажом и эксплуатацией: проверка контуров и сдача системы."
    lesson: "pusconaladka-i-proverka-konturov"
  - term: "РСУ"
    full: "Распределённая система управления"
    note: "Класс систем для больших непрерывных производств; контроллеры и операторские станции в одной среде."
    lesson: "chto-takoe-asutp-urovni-struktura"
    analog: "DCS"
  - term: "ФСА"
    full: "Функциональная схема автоматизации"
    note: "Главный чертёж автоматчика: что измеряем, чем управляем, где стоят приборы."
    lesson: "chtenie-shem-avtomatizacii-fsa"
    analog: "P&ID"
  - term: "ЧРП"
    full: "Частотно-регулируемый привод"
    note: "Управляет оборотами двигателя изменением частоты; экономит энергию на насосах и вентиляторах."
    lesson: "ispolnitelnye-mehanizmy-i-chastotniki"
    analog: "VFD"
  - term: "DCS"
    full: "Distributed Control System"
    note: "Международное название РСУ."
    lesson: "chto-takoe-asutp-urovni-struktura"
    analog: "РСУ"
  - term: "HART"
    full: "Highway Addressable Remote Transducer"
    note: "Цифровой протокол поверх токовой петли 4–20 мА: настройка и диагностика датчика без демонтажа."
    lesson: "signaly-4-20ma-i-diskretnye"
  - term: "HMI"
    full: "Human-Machine Interface"
    note: "Панель или экран оператора у машины; мнемосхемы — его язык."
    lesson: "mnemoshemy"
  - term: "LD"
    full: "Ladder Diagram"
    note: "«Релейный» графический язык ПЛК — самый распространённый на производстве."
    lesson: "ladder-diagram-ld"
  - term: "OPC UA"
    full: "Open Platform Communications Unified Architecture"
    note: "Открытый протокол обмена данными между системами разных производителей."
    lesson: "profibus-profinet-opc-ua"
  - term: "OSI"
    full: "Open Systems Interconnection"
    note: "Семиуровневая модель сетей — каркас, на который ложатся все промышленные протоколы."
    lesson: "osnovy-setey-osi-ip-kabeli"
  - term: "P&ID"
    full: "Piping and Instrumentation Diagram"
    note: "Международный аналог ФСА: трубопроводы и КИП на одной схеме."
    lesson: "chtenie-shem-avtomatizacii-fsa"
    analog: "ФСА"
  - term: "PID"
    full: "Proportional-Integral-Derivative"
    note: "Международное обозначение ПИД-регулирования — в настройках любого контроллера."
    lesson: "pid-regulirovanie"
    analog: "ПИД"
  - term: "PLC"
    full: "Programmable Logic Controller"
    note: "Международное название ПЛК — в документации и средах программирования."
    lesson: "chto-takoe-plk-cikl-skanirovaniya"
    analog: "ПЛК"
  - term: "RS-485"
    full: "Стандарт физического уровня последовательной связи"
    note: "Двухпроводная промышленная шина; поверх неё обычно ходит Modbus RTU."
    lesson: "promyshlennye-seti-rs485-master-slave"
  - term: "SCADA"
    full: "Supervisory Control And Data Acquisition"
    note: "Верхний уровень: визуализация, алармы, тренды и архивы процесса."
    lesson: "scada-osnovy-tegi-arhitektura"
  - term: "SIL"
    full: "Safety Integrity Level"
    note: "Уровень полноты безопасности (1–4): насколько надёжной обязана быть защита."
    lesson: "funkcionalnaya-bezopasnost-paz-sil"
  - term: "SIS"
    full: "Safety Instrumented System"
    note: "Международное название ПАЗ."
    lesson: "funkcionalnaya-bezopasnost-paz-sil"
    analog: "ПАЗ"
  - term: "ST"
    full: "Structured Text"
    note: "Текстовый язык ПЛК, похожий на Паскаль; для сложной логики и математики."
    lesson: "structured-text-st"
  - term: "VFD"
    full: "Variable Frequency Drive"
    note: "Международное название частотного привода (ЧРП)."
    lesson: "ispolnitelnye-mehanizmy-i-chastotniki"
    analog: "ЧРП"

kipia-aes:
  - term: "АЭС"
    full: "Атомная электростанция"
    note: "Станция, где пар для турбины даёт ядерный реактор."
    lesson: "aes-professiya-i-napravleniya-atomtehenergo"
  - term: "ВВЭР"
    full: "Водо-водяной энергетический реактор"
    note: "Основной российский тип реактора: вода — и теплоноситель, и замедлитель (ВВЭР-1000/1200)."
    lesson: "aes-vver-1200-i-kontury"
  - term: "ВХР"
    full: "Водно-химический режим"
    note: "Химия воды контуров: от неё зависят коррозия и ресурс оборудования."
    lesson: "aes-vhr-i-analizatory"
  - term: "ГЦН"
    full: "Главный циркуляционный насос"
    note: "Гоняет теплоноситель первого контура через активную зону."
    lesson: "aes-vver-1200-i-kontury"
  - term: "КИП"
    full: "Контрольно-измерительные приборы"
    note: "На АЭС работают в гермозоне: радиация, температура и требования к ресурсу выше обычных."
    lesson: "aes-kip-na-vver-osobennosti"
  - term: "НП"
    full: "Нормы и правила в области использования атомной энергии"
    note: "Федеральные документы Ростехнадзора; НП-001 — общие положения безопасности АЭС."
    lesson: "aes-klassy-bezopasnosti-np-001"
  - term: "ОПБ"
    full: "Общие положения обеспечения безопасности атомных станций"
    note: "Второе имя НП-001: классы безопасности элементов АЭС берутся отсюда."
    lesson: "aes-klassy-bezopasnosti-np-001"
  - term: "ПГ"
    full: "Парогенератор"
    note: "Граница первого и второго контуров: тепло реактора превращает воду второго контура в пар."
    lesson: "aes-uroven-pg-2oo3"
  - term: "ПМИ"
    full: "Программа и методика испытаний"
    note: "Документ, по которому наладчик проверяет систему и сдаёт её комиссии."
    lesson: "aes-process-pnr-programmy-pmi-priyomka"
  - term: "ПНР"
    full: "Пусконаладочные работы"
    note: "На АЭС — строго документированный процесс: рабочие программы, протоколы, приёмка."
    lesson: "aes-process-pnr-programmy-pmi-priyomka"
  - term: "РБ"
    full: "Радиационная безопасность"
    note: "Дозиметрия, зоны, допуски — правила работы наладчика на действующем блоке."
    lesson: "aes-radiacionnaya-bezopasnost"
  - term: "СИ"
    full: "Средства измерений"
    note: "Приборы, подлежащие поверке; на АЭС метрология жёстче, чем в общепроме."
    lesson: "aes-metrologiya-na-aes"
  - term: "2oo3"
    full: "Two out of three — «два из трёх»"
    note: "Резервирование измерительных каналов: защита срабатывает, когда согласны два канала из трёх."
    lesson: "aes-zashchity-2oo3-i-c-and-e"
  - term: "C&E"
    full: "Cause and Effect — матрица «причина–следствие»"
    note: "Таблица защит и блокировок: какое событие какое действие вызывает."
    lesson: "aes-zashchity-2oo3-i-c-and-e"

operator-cnc:
  - term: "ЕСДП"
    full: "Единая система допусков и посадок"
    note: "Квалитеты и посадки на чертеже — сколько отклонения разрешено детали."
    lesson: "14-cnc-dopuski"
  - term: "ЕСКД"
    full: "Единая система конструкторской документации"
    note: "ГОСТы о том, как оформляются и читаются машиностроительные чертежи."
    lesson: "13-cnc-eskd"
  - term: "ОТК"
    full: "Отдел технического контроля"
    note: "Принимает деталь: годна, брак или на доработку — с документами."
    lesson: "34-cnc-otk"
  - term: "СИЗ"
    full: "Средства индивидуальной защиты"
    note: "Очки, обувь, наушники — защита у станка обязательна до первого запуска."
    lesson: "05-cnc-siz"
  - term: "СОЖ"
    full: "Смазочно-охлаждающая жидкость"
    note: "Охлаждает зону резания и отводит стружку; выбор зависит от материала и операции."
    lesson: "12-cnc-soj"
  - term: "ТК"
    full: "Технологическая карта"
    note: "Пошаговый план обработки детали: операции, инструмент, режимы."
    lesson: "17-cnc-tehkarta"
  - term: "УП"
    full: "Управляющая программа"
    note: "Текст из G- и M-кодов, по которому станок обрабатывает деталь."
    lesson: "22-cnc-struktura-up"
  - term: "ЧПУ"
    full: "Числовое программное управление"
    note: "Станком управляет программа, а не руки; оператор готовит, наблюдает и корректирует."
    lesson: "01-cnc-karta-puti"
    analog: "CNC"
  - term: "G-код"
    full: "Подготовительные команды управляющей программы"
    note: "G00–G03 — перемещения, циклы и режимы; общий язык всех стоек ЧПУ."
    lesson: "19-cnc-g00-g03"
  - term: "M-код"
    full: "Вспомогательные команды управляющей программы"
    note: "Включение шпинделя, СОЖ, смена инструмента, конец программы."
    lesson: "22-cnc-struktura-up"
  - term: "CNC"
    full: "Computer Numerical Control"
    note: "Международное название ЧПУ — в документации станков и CAM-системах."
    lesson: "02-cnc-vidy-stankov"
    analog: "ЧПУ"
  - term: "G54"
    full: "Рабочая система координат (ноль детали)"
    note: "Смещение нуля станка в ноль детали; G54–G59 — до шести заготовок на столе."
    lesson: "26-cnc-nul-detali"
  - term: "ISO"
    full: "Международная организация по стандартизации"
    note: "Маркировка твердосплавных пластин и державок задана стандартами ISO."
    lesson: "10-cnc-instrument"
  - term: "Ra, Rz"
    full: "Параметры шероховатости поверхности"
    note: "Ra — среднее отклонение профиля, Rz — высота неровностей; требования стоят на чертеже."
    lesson: "15-cnc-sherokhovatost"
  - term: "Vc, f, ap"
    full: "Скорость резания, подача, глубина резания"
    note: "Три параметра режима резания; считаются по каталогу инструмента."
    lesson: "11-cnc-rejimy-rezaniya"

svarshchik:
  - term: "ВИК"
    full: "Визуальный и измерительный контроль"
    note: "Первый и обязательный метод контроля шва: глаза, лупа, шаблоны."
    lesson: "03-svar-vik"
  - term: "ЕТКС"
    full: "Единый тарифно-квалификационный справочник"
    note: "Откуда берутся разряды сварщика со 2-го по 6-й."
    lesson: "03-svar-razryady-etks"
  - term: "МИГ/МАГ"
    full: "Механизированная сварка проволокой в инертном/активном газе"
    note: "Полуавтомат: проволока подаётся автоматически, газ защищает ванну."
    lesson: "01-svar-princip-mig-mag"
    analog: "MIG/MAG"
  - term: "МПК"
    full: "Магнитопорошковый контроль"
    note: "Выявляет поверхностные трещины намагничиванием и порошком."
    lesson: "04-svar-nk-metody"
  - term: "НАКС"
    full: "Национальное агентство контроля сварки"
    note: "Аттестация сварщиков в России: без действующего удостоверения НАКС на ответственные объекты не пускают."
    lesson: "01-svar-sistema-naks"
  - term: "НК"
    full: "Неразрушающий контроль"
    note: "Проверка шва без разрушения: УЗК, РК, ПВК, МПК."
    lesson: "04-svar-nk-metody"
    analog: "NDT"
  - term: "ПВК"
    full: "Контроль проникающими веществами (капиллярный)"
    note: "Пенетрант затекает в дефект и проявляется цветным следом."
    lesson: "04-svar-nk-metody"
  - term: "ПТД"
    full: "Производственно-технологическая документация"
    note: "Технологические карты сварки: режимы, материалы, порядок швов."
    lesson: "02-svar-ptd-wps"
    analog: "WPS"
  - term: "РД"
    full: "Ручная дуговая сварка покрытым электродом"
    note: "Базовый способ: с него начинается обучение и первая аттестация."
    lesson: "02-svar-tekhnika-rd"
    analog: "MMA"
  - term: "РК"
    full: "Радиографический контроль"
    note: "Просвечивание шва рентгеном: внутренние поры и непровары видны на снимке."
    lesson: "04-svar-nk-metody"
  - term: "СИЗ"
    full: "Средства индивидуальной защиты"
    note: "Маска с фильтром, краги, роба — защита от дуги, брызг и аэрозоля."
    lesson: "03-svar-siz-i-post"
  - term: "ТИГ"
    full: "Сварка неплавящимся вольфрамовым электродом в инертном газе"
    note: "Самый точный способ: нержавейка, алюминий, тонкий металл."
    lesson: "01-svar-tig-oborudovanie"
    analog: "TIG"
  - term: "УЗК"
    full: "Ультразвуковой контроль"
    note: "Ищет внутренние дефекты шва отражённой ультразвуковой волной."
    lesson: "04-svar-nk-metody"
  - term: "MIG/MAG"
    full: "Metal Inert Gas / Metal Active Gas"
    note: "Международное название полуавтоматической сварки МИГ/МАГ."
    lesson: "01-svar-princip-mig-mag"
    analog: "МИГ/МАГ"
  - term: "MMA"
    full: "Manual Metal Arc"
    note: "Международное название ручной дуговой сварки (РД) — на табличках инверторов."
    lesson: "02-svar-tekhnika-rd"
    analog: "РД"
  - term: "NDT"
    full: "Non-Destructive Testing"
    note: "Международное название неразрушающего контроля (НК)."
    lesson: "04-svar-nk-metody"
    analog: "НК"
  - term: "TIG"
    full: "Tungsten Inert Gas"
    note: "Международное название аргонодуговой сварки вольфрамовым электродом (ТИГ)."
    lesson: "01-svar-tig-oborudovanie"
    analog: "ТИГ"
  - term: "WPS"
    full: "Welding Procedure Specification"
    note: "Международный аналог сварочной техкарты из ПТД."
    lesson: "02-svar-ptd-wps"
    analog: "ПТД"
