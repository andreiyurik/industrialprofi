# Словарь профессиональных сокращений — данные страницы /glossary.
#
# Формат: ключ верхнего уровня = slug опубликованной профессии (группа на
# странице); внутри — записи по алфавиту (кириллица, затем латиница):
#   term:   само сокращение, как его пишут в документах
#   full:   расшифровка
#   note:   одна строка пояснения — зачем это знать (не энциклопедия!)
#   lesson: slug урока, где термин разобран (опционально; если урок не найден
#           или не указан, страница подставит ссылку на поиск)
#   analog: аналог в другой системе обозначений (опционально): УЗО ≈ RCD.
#           Именно АНАЛОГ, не перевод — ставьте только честные пары; у ПУЭ
#           или НАКС аналога нет, и это нормально. Если аналог есть в словаре
#           своей записью, страница свяжет их якорем автоматически.
#
# Это справочные данные, не пользовательский контент: правка = коммит,
# история = git. Только сокращения и аббревиатуры — понятия объясняют уроки.

elektrik:
  - term: "АВ"
    full: "Автоматический выключатель"
    note: "Защищает линию от перегрузки и короткого замыкания; выбирается по номиналу и характеристике B/C/D."
    lesson: "01-avtomaticheskie-vyklyuchateli"
    analog: "MCB"
  - term: "АВДТ"
    full: "Автоматический выключатель дифференциального тока (дифавтомат)"
    note: "Автомат и УЗО в одном корпусе: защищает и линию, и человека."
    lesson: "02-uzo-i-difavtomaty"
    analog: "RCBO"
  - term: "АВР"
    full: "Автоматический ввод резерва"
    note: "Автоматически переключает питание на резервный источник при пропадании основного."
    lesson: "03-kategorii-nadezhnosti"
  - term: "ВВГнг(А)-LS"
    full: "Кабель с виниловой изоляцией, не распространяющий горение, с пониженным дымовыделением"
    note: "Основная марка медного кабеля для стационарной проводки в жилых зданиях."
    lesson: "01-marki-kabeley"
  - term: "ВЛ"
    full: "Воздушная линия электропередачи"
    note: "Провода на опорах; для ввода в частный дом обычно применяется СИП."
  - term: "ВРУ"
    full: "Вводно-распределительное устройство"
    note: "Главный щит здания: ввод, учёт и распределение энергии по стоякам и группам."
    lesson: "01-logika-komponovki-shchita"
  - term: "ГЗШ"
    full: "Главная заземляющая шина"
    note: "Шина, к которой сходятся заземляющие и защитные проводники здания; основа уравнивания потенциалов."
    lesson: "03-uravnivanie-potencialov"
  - term: "ГОСТ"
    full: "Государственный стандарт"
    note: "В электрике ГОСТы задают требования к маркировке, соединениям и испытаниям."
  - term: "ГРЩ"
    full: "Главный распределительный щит"
    note: "Щит, с которого начинается распределение электроэнергии по зданию."
    lesson: "01-logika-komponovki-shchita"
  - term: "ДСУП"
    full: "Дополнительная система уравнивания потенциалов"
    note: "Обязательна в ванных: соединяет проводящие части помещения между собой и с защитным проводником."
    lesson: "03-uravnivanie-potencialov"
  - term: "ЗУ"
    full: "Заземляющее устройство"
    note: "Заземлитель в грунте плюс заземляющие проводники; его сопротивление нормируется и измеряется."
    lesson: "03-soprotivlenie-zazemleniya"
  - term: "КЗ"
    full: "Короткое замыкание"
    note: "Аварийное соединение проводников с малым сопротивлением; ожидаемый ток КЗ определяет выбор защиты."
    lesson: "01-avtomaticheskie-vyklyuchateli"
  - term: "КИП"
    full: "Контрольно-измерительные приборы"
    note: "Мультиметры, токовые клещи, мегаомметры — всё, чем электрик измеряет."
    lesson: "02-multimetr-i-kleshchi"
  - term: "КЛ"
    full: "Кабельная линия электропередачи"
    note: "Линия из кабелей в земле, трубах или кабельных сооружениях."
  - term: "ЛЭП"
    full: "Линия электропередачи"
    note: "Общее название линий передачи электроэнергии — воздушных (ВЛ) и кабельных (КЛ)."
  - term: "НКУ"
    full: "Низковольтное комплектное устройство"
    note: "Заводское название щитов и распределительных сборок на напряжение до 1000 В."
    lesson: "01-logika-komponovki-shchita"
  - term: "ПВС"
    full: "Провод виниловый соединительный"
    note: "Гибкий провод для переносных приборов и удлинителей; для стационарной проводки не применяется."
    lesson: "01-marki-kabeley"
  - term: "ПОТЭЭ"
    full: "Правила по охране труда при эксплуатации электроустановок"
    note: "Откуда берутся группы допуска, наряды и организационные меры безопасности."
    lesson: "01-gruppy-elektrobezopasnosti"
  - term: "ППР"
    full: "Планово-предупредительный ремонт"
    note: "Обслуживание оборудования по графику, а не по факту поломки."
    lesson: "01-operativnye-obkhody-i-zhurnal"
  - term: "ПТЭЭП"
    full: "Правила технической эксплуатации электроустановок потребителей"
    note: "Как эксплуатировать электроустановки: персонал, документация, обслуживание (Приказ № 811)."
    lesson: "01-pteep-prikaz-811"
  - term: "ПУЭ"
    full: "Правила устройства электроустановок"
    note: "Главный документ электрика: как проектировать и монтировать электроустановки."
    lesson: "01-chto-takoe-pue"
  - term: "СИЗ"
    full: "Средства индивидуальной защиты"
    note: "Диэлектрические перчатки, боты, каска, очки — то, что защищает самого электрика."
    lesson: "01-siz-elektrika"
  - term: "СИП"
    full: "Самонесущий изолированный провод"
    note: "Изолированный провод для воздушных линий и вводов в дом; не требует несущего троса."
    lesson: "01-marki-kabeley"
  - term: "СЛР"
    full: "Сердечно-лёгочная реанимация"
    note: "Первая помощь при остановке сердца — обязательный навык для группы допуска."
    lesson: "03-osvobozhdenie-ot-toka-praktika"
  - term: "СНиП"
    full: "Строительные нормы и правила"
    note: "Старое название строительных норм; большинство заменено сводами правил (СП)."
  - term: "СП"
    full: "Свод правил"
    note: "Современный формат строительных норм; для электрики зданий ключевой — СП 256.1325800."
  - term: "СУП"
    full: "Система уравнивания потенциалов"
    note: "Соединяет проводящие части здания в единую сеть, чтобы между ними не возникала опасная разность потенциалов."
    lesson: "03-uravnivanie-potencialov"
  - term: "ТП"
    full: "Трансформаторная подстанция"
    note: "Понижает 6–10 кВ до 0,4 кВ и распределяет энергию потребителям."
    lesson: "03-trehfaznaya-set"
  - term: "УГО"
    full: "Условные графические обозначения"
    note: "Стандартные значки элементов на схемах — язык, на котором схемы читаются."
    lesson: "01-ugo-i-chtenie-shem"
  - term: "УЗИП"
    full: "Устройство защиты от импульсных перенапряжений"
    note: "Защищает электроустановку от грозовых и коммутационных импульсов."
    lesson: "03-uzip-i-rele-napryazheniya"
    analog: "SPD"
  - term: "УЗО"
    full: "Устройство защитного отключения"
    note: "Отключает питание при токе утечки; главная защита человека от поражения током."
    lesson: "02-uzo-i-difavtomaty"
    analog: "RCD"
  - term: "ЭДС"
    full: "Электродвижущая сила"
    note: "Характеристика источника питания: способность создавать ток в цепи; измеряется в вольтах."
    lesson: "01-zakon-oma-i-kirkhgofa"
    analog: "EMF"
  - term: "cos φ"
    full: "Коэффициент мощности"
    note: "Доля активной мощности в полной; важен при расчёте нагрузок и сечений."
    lesson: "01-moshchnost-p-q-s"
    analog: "PF"
  - term: "MCB"
    full: "Miniature Circuit Breaker"
    note: "Международное название модульного автоматического выключателя — на импортной аппаратуре и в даташитах."
    lesson: "01-avtomaticheskie-vyklyuchateli"
    analog: "АВ"
  - term: "N"
    full: "Нулевой рабочий проводник (нейтраль)"
    note: "По нему возвращается рабочий ток; маркируется голубым цветом."
    lesson: "02-sistemy-zazemleniya-tn-tt-it"
  - term: "PE"
    full: "Защитный проводник (Protective Earth)"
    note: "Соединяет корпуса оборудования с землёй; жёлто-зелёная маркировка, рабочий ток по нему не течёт."
    lesson: "02-sistemy-zazemleniya-tn-tt-it"
  - term: "PEN"
    full: "Совмещённый защитный и нулевой рабочий проводник"
    note: "Один проводник в роли PE и N (система TN-C); в современных установках разделяется на PE и N."
    lesson: "02-sistemy-zazemleniya-tn-tt-it"
  - term: "RCBO"
    full: "Residual Current Breaker with Overcurrent protection"
    note: "Международное название дифавтомата."
    lesson: "02-uzo-i-difavtomaty"
    analog: "АВДТ"
  - term: "RCD"
    full: "Residual Current Device"
    note: "Международное название УЗО — на корпусах импортных устройств и в англоязычной документации."
    lesson: "02-uzo-i-difavtomaty"
    analog: "УЗО"
  - term: "SPD"
    full: "Surge Protective Device"
    note: "Международное название УЗИП; классы испытаний I/II/III на корпусе."
    lesson: "03-uzip-i-rele-napryazheniya"
    analog: "УЗИП"
  - term: "TN, TT, IT"
    full: "Системы заземления"
    note: "Классификация по способу связи нейтрали источника и корпусов с землёй: TN-C, TN-S, TN-C-S, TT, IT."
    lesson: "02-sistemy-zazemleniya-tn-tt-it"
