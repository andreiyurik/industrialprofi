ru:
  diagrams:
    osi_layers:
      alt: "Два стека слоёв OSI — 7, 4, 3, 2 и 1 — у АРМ SCADA и ПЛК, соединённые кабелем. Запрос Modbus заворачивается в TCP, IP и Ethernet и разворачивается на другой стороне. При неисправности проверка идёт снизу вверх до отказавшего слоя."
      devices:
        scada: "АРМ SCADA"
        plc: "ПЛК"
      cable: "кабель"
      layers:
        l7: "Прикладной"
        l4: "Транспортный"
        l3: "Сетевой"
        l2: "Канальный"
        l1: "Физический"
      wraps:
        ip: "адреса"
        read: "прочитай"
        register: "регистр"
      checks:
        pass:
          l1: "✓ линк горит"
          l2: "✓ MAC виден"
          l3: "✓ ping проходит"
          l4: "✓ порт 502 открыт"
        fail:
          l1: "✗ линка нет"
          l3: "✗ ping не идёт"
          l7: "✗ ошибка 02"
      skip: "не проверяли"
      phases:
        message: "АРМ SCADA составляет «письмо» Modbus: прочитай регистр."
        wrap: "Вниз по слоям: TCP, а за ним IP кладут письмо в свои конверты — с портом и адресами."
        frame: "Ethernet добавляет внешний конверт с MAC-адресами."
        wire: "Всё вместе уходит по кабелю в виде сигналов."
        unwrap: "ПЛК поднимает посылку вверх: каждый слой снимает свой конверт."
        done: "ПЛК прочитал тот самый запрос Modbus. Ответ пойдёт тем же путём обратно."
        summary: "Отправитель заворачивает запрос Modbus в конверты TCP, IP и Ethernet, получатель снимает их по очереди."
        checking: "Данных нет. Проверяем снизу вверх, начиная со слоя 1."
        cable: "Слой 1: линка нет. Проверь кабель, разъёмы и питание на обоих концах."
        subnet: "Слой 3: при маске /24 это разные подсети. Проверь IP-адрес, маску и шлюз."
        register: "Слой 7: ПЛК отвечает, но такого адреса нет. Сверь номер регистра с картой Modbus."
      choose: "Что случилось в сети"
      options:
        path: "Всё исправно"
        cable: "Обрыв кабеля"
        subnet: "Чужая подсеть"
        register: "Неверный регистр"
