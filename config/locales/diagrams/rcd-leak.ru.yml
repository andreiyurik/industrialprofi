ru:
  diagrams:
    rcd_leak:
      alt: "Схема УЗО: провода L и N проходят через тороидальный сердечник к прибору. При пробое на корпус часть тока уходит через человека в землю, разность токов достигает порога, и УЗО размыкает оба провода. При замыкании между L и N токи равны, и УЗО не срабатывает. Полоски токов показаны не в масштабе."
      rcd: "УЗО 30 мА"
      relay: "реле"
      case: "металл. корпус"
      earth: "земля"
      bypass: "утечка мимо N"
      tripped: "ОТКЛЮЧЕНО"
      short_tag: "КЗ L–N"
      through_l: "по L"
      through_n: "по N"
      difference: "разница"
      threshold: "порог 30 мА"
      zero: "равна нулю"
      choose: "Что случилось"
      modes:
        earth: "Утечка на землю"
        short: "КЗ между L и N"
      phases:
        normal: "Норма: сколько тока ушло по L, столько вернулось по N. Разницы нет."
        fault: "Изоляция пробита: незаземлённый корпус под напряжением. Человек тянется к нему."
        touch: "Касание: часть тока идёт через человека в землю, мимо N. I(L) > I(N)."
        sensed: "Разница дошла до порога: в обмотке наводится ЭДС — сигнал на отключение."
        trip: "УЗО разомкнуло L и N. Удар был, но оборван за доли секунды (здесь время растянуто)."
        reset: "Повреждение устранили, УЗО включили вручную."
        short: "Замыкание между L и N: ток намного больше обычного."
        blind: "Но по L и N он одинаков — УЗО не срабатывает. Здесь нужен автомат."
