ru:
  diagrams:
    ld_ton:
      alt: "Релейная схема: пуск и стоп насоса с самоподхватом, таймер TON с выдержкой 3 секунды открывает клапан; ниже временная диаграмма сигналов"
      start: "Пуск"
      stop_nc: "Стоп (NC)"
      pump: "Насос"
      valve: "Клапан"
      input: "вход = %{value}"
      hold: "самоподхват"
      flow: "ток идёт"
      second: " с"
      reset: "сброс"
      phase_1: "Покой: СТОП не нажат, его вход = 1. ПУСК разомкнут — насос стоит."
      phase_2: "Нажали ПУСК: насос включился, замкнулся его контакт, TON начал отсчёт."
      phase_3: "ПУСК отпущен: цепь держит контакт самого насоса. ET растёт."
      phase_4: "СТОП раньше PT: цепь разорвана, ET сброшен в 0, Q так и не включился."
      phase_5: "Снова ПУСК: насос на самоподхвате, TON отсчитывает с нуля."
      phase_6: "ET дошёл до PT: Q = 1, клапан открыт. ET остаётся равным PT."
      phase_7: "СТОП: насос выключен, IN = 0 — Q и ET сбрасываются сразу."
