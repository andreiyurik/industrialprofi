ru:
  diagrams:
    pid_response:
      aria: "График температуры после подъёма уставки с 60 до 80 °C. П-регулятор останавливается на 77 °C. ПИ доходит до 80 °C с забросом до 82,3 °C. ПИД доходит до 80 °C с забросом до 80,6 °C."
      y_axis: "PV, °C"
      x_axis: "время, с"
      setpoint: "уставка SP: 60 → 80 °C"
      offset: "ошибка 3 °C"
      peak_pi: "82,3"
      peak_pid: "80,6"
      choose: "Какую кривую показать"
      names:
        all: "Все"
        p: "П"
        pi: "ПИ"
        pid: "ПИД"
      keys:
        p: "застрял на 77 °C"
        pi: "80 °C, заброс +2,3"
        pid: "80 °C, заброс +0,6"
      phases:
        rise: "Уставку подняли: 60 → 80 °C. Только П: чем больше ошибка, тем больше мощность"
        offset: "П замер на 77 °C: чтобы держать прибавку мощности, ему нужна ошибка"
        integral: "ПИ: И копит ошибку (заливка) и меняет мощность, пока ошибка не уйдёт в ноль"
        derivative: "ПИД: Д видит быстрый рост температуры и заранее убавляет мощность"
        summary: "П недобирает, И убирает остаток ошибки, Д уменьшает заброс"
        only_p: "П: быстрый выход, но остаётся статическая ошибка 3 °C"
        only_pi: "ПИ: площадь под уставкой наращивает И, над уставкой — убавляет. Ошибка → 0"
        only_pid: "ПИД: заброс меньше, чем у ПИ, при тех же Kp и Tи"
      model: "Расчётный пример: Kp у всех трёх один, Tи у ПИ и ПИД — 70 с, Tд — 4 с. На другом объекте числа будут другими."
