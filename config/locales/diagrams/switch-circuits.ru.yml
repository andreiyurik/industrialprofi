      panel: "щит"
      lamp: "лампа"
      hint: "Щёлкай клавиши и следи, куда доходит фаза"
      states:
        "off": "разомкнут"
        "on": "замкнут"
        one: "COM — 1"
        two: "COM — 2"
        straight: "прямо"
        crossed: "крест-накрест"
