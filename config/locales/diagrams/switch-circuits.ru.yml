ru:
  diagrams:
    switch_circuits:
      alt: "Принципиальная схема управления освещением: фаза L идёт через выключатели к лампе, нейтраль N соединена с лампой напрямую"
      mode: "Схема"
      modes:
        single: "Одноклавишный"
        two: "Проходные"
        cross: "С перекрёстным"
