    eyebrow: "Collaboration"
    title: "For training centers and companies"
    meta_description: "IndustrialProfi for training centers and companies: open trade-skills programs, free to use — and closed on-prem deployments on your own servers."
    intro: "IndustrialProfi is a free, open platform for training in industrial trades: official standards, practical tasks, visible progress. You can already use it to train your students and employees, but we want to grow sustainably and be useful to organizations too. We're open to new collaboration proposals and feedback that improves the platform."
