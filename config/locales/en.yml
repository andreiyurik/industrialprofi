    ohms-law:
      title: "Ohm's law: current, voltage, resistance calculator"
      tagline: "Enter any two of U, I, R, P — the calculator finds the rest."
      intro: "Ohm's law links voltage, current, and resistance, and the power formula adds a fourth quantity. Fill in any two fields — the calculator computes the remaining two."
      norm: "Formulas: U = I·R and P = U·I (Ohm's law and the DC power definition)."
      fields_hint: "Fill in any two fields — the rest are calculated automatically."
      diagram_title: "The Ohm's law wheel: which values you set, and which were calculated"
      diagram_legend: "Bright highlights what you entered; blue is what the formulas calculated."
      method:
        steps:
          - "Ohm's law links three quantities: U = I · R. Knowing any two, you get the third by rearranging the formula."
          - "Power adds a fourth: P = U · I, and via Ohm's law also P = I² · R and P = U² / R."
          - "So any two of the four values are enough: the calculator plugs them into the right formula and outputs the remaining two."
        example: "U = 12 V and R = 4 Ω → current I = 12 / 4 = 3 A, power P = 12 · 3 = 36 W."
    voltage-drop:
      title: "Cable voltage drop calculator"
      tagline: "Voltage loss over a long line, in volts and percent."
      intro: "On a long line, some voltage is lost to the conductor's resistance — the load ends up with less than the source. The calculator estimates the loss from material, cross-section, length, and current."
      norm: "ΔU = k·ρ·L·I / S, where k = 2 (single-phase) or √3 (three-phase); ρ — resistivity (copper 0.0175; aluminum 0.0294 Ω·mm²/m)."
      result_drop: "Voltage drop, ΔU"
      result_percent: "Voltage drop, ΔU"
      verdict_ok: "Within the 5% limit"
      verdict_warn: "Exceeds the 5% limit — a larger cross-section or a shorter line is needed"
      diagram_title: "The line from panel to load, with the drop shown against the limit"
      diagram_source: "Panel"
      diagram_load: "Load"
      diagram_scale: "Drop relative to the limit"
      norm_note: "The limit for power and lighting circuits is usually no more than 5%. Reactive resistance of the conductor is ignored (acceptable for cross-sections up to roughly 50–95 mm²)."
      method:
        steps:
          - "Conductor resistance is calculated from its length and cross-section: the longer the line and the thinner the conductor, the bigger the loss."
          - "The multiplier depends on the network: in single-phase, current travels there and back, so the length doubles; in three-phase, √3 replaces the 2."
          - "The loss is compared to the supply voltage and converted to a percentage — the limit for power and lighting circuits is usually no more than 5%."
        example: "Copper, three-phase, 50 m, 20 A current, 4 mm² cross-section at 380 V → a drop of 7.58 V, which is 1.99% — comfortably within limits."
    grounding:
      title: "Grounding calculator: earth electrode resistance (PUE)"
      tagline: "Resistance of a vertical earth electrode and how many electrodes you need to meet the limit."
      intro: "A grounding system's resistance must not exceed the limit (4 Ω for most electrical installations). The calculator estimates the resistance of one vertical electrode and of a group, and how many electrodes you need to drive to meet the limit. Soil resistivity is taken with a seasonal (climate) coefficient."
      norm: "R₁ = ρ·ψ/(2π·L)·[ln(2L/d) + 0.5·ln((4t+L)/(4t−L))], t = h + L/2; Rgroup = R₁/(n·η). Limits — PUE Ch. 1.7."
      rho: "Soil resistivity, ρ"
      rho_hint: "or pick a typical soil"
      # Values are the same ones that used to be the field's hint text.
      soil_loam: "Loam — 100"
      soil_clay: "Clay — 60"
      soil_sand: "Sand — 500"
      soil_chernozem: "Chernozem — 50"
      psi: "Climate zone (coefficient ψ)"
      psi_1: "Zone I, deep frost ×2.0"
      psi_2: "Zone II ×1.7"
      psi_3: "Zone III ×1.5"
      psi_4: "Zone IV, south ×1.3"
      length: "Electrode length, L"
      diameter: "Electrode diameter, d"
      depth: "Burial depth of the top, h"
      count: "Number of electrodes, n"
      eta: "Utilization factor, η"
      eta_hint: "1 for a single electrode; ~0.6–0.85 for a group"
      target: "Required resistance"
      result_single: "Resistance of one electrode"
      result_group: "Resistance of the group"
      result_required: "Electrodes needed to meet the limit"
      verdict_ok: "The loop meets the required resistance"
      verdict_warn: "Limit not met — add electrodes or make them longer"
      diagram_title: "Cross-section of the loop in the soil: driven electrodes and the ones still missing"
      diagram_surface: "Ground surface"
      diagram_legend: "Solid rods are driven electrodes; dashed ones show how many more are needed to meet the limit. Depth and length are shown to scale."
      info:
        rho: "Soil resistivity — how well the soil conducts current. Depends on type and moisture: sand conducts poorly (high ρ), clay conducts well (low ρ)."
        psi: "Seasonal (climate) coefficient — a margin for soil that conducts worse once frozen in winter. The harsher the climate zone, the higher it is."
        eta: "Utilization factor — nearby electrodes interfere with each other, so a group performs worse than the sum of its parts. Depends on their number and spacing."
      note: "An estimate for vertical electrodes; a horizontal connecting strip is not accounted for — it slightly lowers the total. The utilization factor η depends on the number of electrodes and spacing between them (taken from PUE/reference tables)."
      method:
        steps:
          - "We take soil resistivity as the design value: the table value multiplied by the climate coefficient, because frozen soil conducts worse."
          - "We calculate the resistance of one vertical electrode — it depends on its length, diameter, and burial depth."
          - "A group of electrodes isn't just divided by their count: neighboring electrodes interfere with each other, so the utilization factor goes into the denominator."
        example: "Loam at 100 Ω·m in climate zone III, a 3 m electrode with a 16 mm diameter: one electrode gives 49.99 Ω, four with a factor of 0.7 give 17.85 Ω. To meet the 4 Ω limit, you'd need 18 of them."
    rcd:
      title: "Leakage current and RCD selection calculator"
      tagline: "Estimated line leakage current and a check for nuisance RCD tripping."
      intro: "An RCD trips on leakage current, but even healthy wiring and equipment has some natural leakage. To avoid nuisance tripping, the working leakage current should be no more than a third of the RCD's rating. The calculator estimates leakage current from the load and wiring length and compares it with the chosen rating."
      norm: "Ileak = 0.4 mA·Iload + 0.01 mA·Lwire; working leakage current ≤ ⅓ of the RCD rating (PUE 7.1.83). A 30 mA rating protects people; 100/300 mA is for fire protection."
      current: "Line load current, I"
      length: "Phase conductor length, L"
      setting: "RCD rating, IΔn"
      setting_10: "10 mA — individual circuits"
      setting_30: "30 mA — outlets, wet areas"
      setting_100: "100 mA — fire protection"
      setting_300: "300 mA — main incomer, fire protection"
      result_ileak: "Calculated leakage current"
      result_threshold: "Allowed (⅓ of rating)"
      verdict_ok: "No nuisance tripping expected"
      verdict_warn: "Leakage exceeds ⅓ of the rating — split the line across several RCDs"
      note: "Green — leakage current within ⅓ of the rating, no nuisance tripping expected. Red — close to the threshold: split the line across several RCDs, or use a higher rating (but don't raise the 30 mA one that protects people). Estimated from PUE guidance; a real measurement will show actual leakage."
      method:
        steps:
          - "Even healthy wiring has natural leakage: it's estimated as 0.4 mA per amp of load current plus 0.01 mA per meter of phase conductor."
          - "The working leakage current is compared with the RCD's rating: it must be no more than a third of it, or the device will start tripping for no reason."
          - "If it doesn't fit — split the line across several RCDs. Don't raise the 30 mA rating to fix this: it protects people, not the wiring."
        example: "A 16 A line, 20 m long → calculated leakage is 0.4 · 16 + 0.01 · 20 = 6.6 mA. For a 30 mA RCD, up to 10 mA is allowed — there's margin."
    short-circuit:
      title: "Short-circuit current calculator (line-to-neutral loop)"
      tagline: "Single-phase short-circuit current at the end of a line, and whether the breaker's instantaneous trip fires."
      intro: "For a breaker to clear a short circuit instantly, the fault current at the farthest point of the line must be high enough. The calculator estimates the line-to-neutral loop current from the line's and supply's resistance, and compares it with the breaker's trip threshold."
      norm: "Isc = Uph/(Zext + Zloop), Zloop ≈ 2·ρ·L/S. Guaranteed instant tripping happens at Isc ≥ k·In at the upper edge of the curve (k: B=5, C=10, D=20, GOST IEC 60898). Method per GOST 28249, requirement — PUE 1.7.79 / GOST R 50571."
      uf: "Phase voltage, Uph"
      zext: "Resistance up to the panel, Zext"
      zext_hint: "transformer + trunk line; ~100 kVA ≈ 0.1; ~250 kVA ≈ 0.04; or a measured loop Z"
      length: "Line length to the fault point, L"
      inom: "Breaker rating, In"
      char: "Breaker curve"
      char_b: "B (×3…5)"
      char_c: "C (×5…10)"
      char_d: "D (×10…20)"
      result_zloop: "Loop resistance, Zloop"
      result_ikz: "Short-circuit current, Isc"
      result_ratio: "Ratio to breaker rating"
      verdict_ok: "The breaker will trip instantly, guaranteed"
      verdict_warn: "Instant tripping isn't guaranteed — check the time-current curve"
      info:
        zext: "Resistance up to the panel — the transformer plus the trunk line to it. You can estimate it from the transformer's rated power, or measure the line-to-neutral loop resistance with a meter."
        char: "Breaker curve (B/C/D) — how many times over the rating the fault current must be for the instantaneous trip to fire: B — 3 to 5×, C — 5 to 10×, D — 10 to 20×."
        ratio: "How many times the short-circuit current exceeds the breaker's rating. It must exceed the curve's upper bound for the breaker to clear the fault instantly."
      note: "A green ratio (≥ the upper bound: B×5, C×10, D×20) means the breaker is guaranteed to clear the fault instantly. Red means instant tripping isn't guaranteed — check the time-current curve, or use a smaller cross-section/rating. Reactive and contact resistances are ignored — for a real project, calculate fully per GOST 28249."
      method:
        steps:
          - "Add up the loop resistance: the part up to the panel (transformer and trunk line), plus the phase and neutral conductor resistance to the fault point."
          - "Divide the phase voltage by this resistance to get the single-phase short-circuit current."
          - "Compare it with the breaker's rating. For the instantaneous trip to fire, guaranteed, use the curve's upper bound: B — ×5, C — ×10, D — ×20."
        example: "220 V, 0.1 Ω up to the panel, 2.5 mm² copper over 30 m → a 0.52 Ω loop, 423 A short-circuit current. For a C16 breaker, that's 26.4× the rating against the needed 10× — tripping is guaranteed."
    cable-cross-section:
      title: "Cable cross-section calculator by power and current (PUE)"
      tagline: "Minimum conductor cross-section by continuous current rating — copper and aluminum."
      intro: "Conductor cross-section is chosen so the cable doesn't overheat under working current. Enter the current directly, or the load power — the calculator picks the smallest cross-section from PUE's continuous current tables."
      norm: "PUE-7, Ch. 1.3: tables 1.3.4 / 1.3.6 (copper) and 1.3.7 / 1.3.8 (aluminum) — continuous current ratings for wires and cables."
      power_hint: "or enter current below"
      current_hint: "fill this in instead of power, if you know it"
      voltage_hint: "blank — by network type (220 / 380 V)"
      result_current: "Calculated current, I"
      result_apparent: "Apparent power, S"
      result_section: "Recommended cross-section, S"
      result_allowed: "Allowed current for the cross-section"
      result_breaker: "Recommended breaker"
      diagram_title: "The ladder of standard cross-sections: the calculated current and the first size that can carry it"
      diagram_current: "Calculated current"
      diagram_legend: "Steps are standard cross-sections, mm²; below each is its continuous current rating. The first step above the line is the right one."
      info:
        allowed: "Continuous current rating — the current a conductor can carry indefinitely without overheating. Must be no less than the calculated load current."
        apparent: "Apparent power S (kVA) — the load including its reactive part. Used to size a generator, UPS, or transformer; active power (kW) is always lower."
      table_caption: "Continuous current rating, A — PUE-7, Ch. 1.3 (tables 1.3.4 / 1.3.6 for copper, 1.3.7 / 1.3.8 for aluminum)"
      factors_note: "A base selection without derating factors for ambient temperature, cable grouping, or insulation type. The breaker rating is chosen to protect the cable (In ≤ Iallowed) and to carry the load (In ≥ Icalc); refine the result by selectivity and curve (B/C/D). For a real project, apply the coefficients from PUE and GOST R 50571.5.52."
      method:
        steps:
          - "Calculate the load's working current: for three-phase, I = P / (√3 · U · cos φ); for single-phase, I = P / (U · cos φ). If the current is already known, enter it directly and skip power."
          - "In the continuous current table, find the smallest standard cross-section whose allowed current is no less than the calculated one — accounting for conductor material and installation method."
          - "Pick the breaker: its rating must be no higher than the cable's allowed current, so the breaker protects the cable, and no lower than the working current, so it doesn't trip under load."
        example: "10 kW, three-phase 380 V, cos φ 0.95 → 16 A. Copper, open in air: the nearest cross-section is 1.5 mm² with an allowed current of 23 A. A standard breaker size — 20 A: bigger than the working 16 A, smaller than the allowed 23 A."
    ma-scaling:
      title: "4-20 mA signal scaling calculator"
      tagline: "Convert a current loop ↔ physical value, both directions."
      intro: "A sensor transmits its measured value as a linear 4–20 mA current: 4 mA is the low end of the range, 20 mA the high end. Set the range and convert current to value and back."
      norm: "Linear scaling: value = Hlo + (I − Ilo)/(Ihi − Ilo)·(Hhi − Hlo). Signal standard — GOST 26.011, 4–20 mA range."
      diagram_title: "Where the signal sits on the 4–20 mA scale, and the same point in engineering units"
      diagram_caption: "Signal on the range scale"
      range_heading: "Measurement and signal range"
      range_min: "Range low end"
      range_max: "Range high end"
      signal_min: "Current at the low end"
      signal_max: "Current at the high end"
      to_eu_heading: "Current → value"
      signal_value: "Signal current"
      result_eu: "Measured value"
      result_percent: "Percent of range"
      to_ma_heading: "Value → current"
      eu_value: "Measured value"
      result_ma: "Signal current"
      info:
        eu: "Engineering (physical) units — what the sensor actually measures: °C, bar, m³/h, and so on. The calculator converts signal current into this value."
        percent: "Percent of range — where the signal sits between the low and high ends: 4 mA = 0%, 12 mA = 50%, 20 mA = 100%."
      method:
        steps:
          - "A sensor transmits its value linearly: 4 mA corresponds to the low end of the range, 20 mA to the high end."
          - "To convert current to value, find the signal's fraction within the 4–20 mA range and take the same fraction of the measurement range."
          - "The reverse conversion is the same operation in the other direction; the calculator computes both directions at once from one range."
        example: "A 0–100 sensor at 12 mA: that's exactly the midpoint of the 4–20 mA range, so 50% of the scale and a value of 50."
    pressure:
      title: "Pressure unit converter: bar, MPa, kgf/cm², online"
      tagline: "Gauges in kgf/cm², sensors in MPa, imports in bar and psi — convert with one input."
      intro: "In instrumentation and control, pressure shows up in different units: old gauges in kgf/cm², sensors and design docs in MPa and bar, draft and head in mm w.c., vacuum in mmHg, imports in psi. Enter a value in one unit — get it in all the others at once."
      norm: "The SI unit is the pascal (Pa); every conversion goes through pascals (GOST 8.417). 1 kgf/cm² ≈ 0.0981 MPa ≈ 0.981 bar (technical atmosphere)."
      table:
        caption: "Conversion factors: pascals per unit (GOST 8.417)"
        col_unit: "Unit"
        col_pascals: "In pascals"
      units:
        bar: "bar"
        kpa: "kPa"
        mpa: "MPa"
        pa: "Pa"
        kgf: "kgf/cm² (at)"
        atm: "atm (physical)"
        psi: "psi (lbf/in²)"
        mmhg: "mmHg"
        mmh2o: "mm w.c."
      method:
        steps:
          - "Every unit is converted to pascals — the SI unit — and from pascals into whatever unit you need."
          - "So converting in either direction comes down to two multiplications, and no precision is lost along the way."
        example: "1 bar = 0.1 MPa = 1.0197 kgf/cm² = 14.504 psi = 750.06 mmHg = 10,197 mm w.c."
    resistance-thermometer:
      title: "Pt100: resistance-to-temperature converter (GOST 6651)"
      tagline: "Convert an RTD's resistance to temperature and back — GOST 6651 characteristic."
      intro: "A resistance temperature detector (TSM, TSP, Pt100) changes resistance with temperature nonlinearly. Pick your sensor type and convert temperature to resistance for calibration and commissioning, or measured resistance back to temperature."
      norm: "Callendar–Van Dusen equation per GOST 6651-2009. Platinum: α 0.00385 (Pt) and 0.00391 (P); copper: α 0.00428 (M). Separate branches for t < 0 and t ≥ 0 °C are accounted for."
      type_heading: "Sensor type (characteristic)"
      type: "RTD"
      to_r_heading: "Temperature → resistance"
      temperature: "Temperature, t"
      result_r: "Resistance, R"
      to_t_heading: "Resistance → temperature"
      resistance: "Resistance, R"
      result_t: "Temperature, t"
      table:
        caption: "Standard characteristics per GOST 6651-2009: resistance at 0 °C, temperature coefficient α, and operating range"
        col_sensor: "Sensor"
        col_r0: "R₀, Ω"
        col_alpha: "α, 1/°C"
        col_range: "Range, °C"
      diagram_title: "The chosen sensor's characteristic curve across its full range, with the calculated point"
      diagram_legend: "The curve is the chosen sensor's characteristic from edge to edge of its range. The filled point came from temperature, the ring from resistance; on matching values they coincide."
      info:
        type: "Type (characteristic) — the nominal static characteristic: which resistance corresponds to which temperature. Pt100 is platinum, 100 Ω at 0 °C; 100M is copper; the letter (P/M) and α set the exact relationship."
      method:
        steps:
          - "Resistance depends on temperature nonlinearly, described by the Callendar–Van Dusen equation with coefficients from the standard."
          - "Below zero the equation has its own branch with an extra term, so the cold and hot ranges are calculated differently."
          - "The reverse direction, from resistance to temperature, is found by iteration: the relationship is monotonic, so the solution is unique."
        example: "Pt100 at 100 °C gives 138.505 Ω. And the reverse: a measured 138.51 Ω corresponds to 100.01 °C."
    measurement-error:
      title: "Measurement error and accuracy class calculator"
      tagline: "Absolute, relative, and reduced error + a pass/fail check against the accuracy class."
      intro: "During calibration, an instrument is compared with a reference: absolute, relative, and reduced error are calculated, and checked against its accuracy class. Enter the instrument reading, the reference value, and the span — the calculator computes all three errors and gives a verdict."
      norm: "Δ = reading − reference; δ = Δ/reference·100%; γ = Δ/span·100% (span — the normalizing value). The instrument passes if |γ| ≤ the accuracy class. Classes — GOST 8.401-80."
      measured: "Instrument reading"
      actual: "Reference (true value)"
      span: "Span, Xn"
      span_hint: "usually the upper limit of the measurement range"
      cls: "Instrument accuracy class"
      cls_hint: "allowed reduced error, %: 0.1 / 0.25 / 0.5 / 1.0 / 1.5"
      result_abs: "Absolute error, Δ"
      result_rel: "Relative error, δ"
      result_red: "Reduced error, γ"
      result_limit: "Allowed by class"
      verdict_ok: "The instrument passes — error is within the accuracy class"
      verdict_warn: "Accuracy class exceeded — reject or adjust"
      diagram_title: "Tolerance scale: the instrument's reduced error against the accuracy class"
      diagram_limit: "Tolerance"
      diagram_legend: "The band around zero is the accuracy-class tolerance; the mark is the instrument's reduced error. The instrument passes as long as the mark stays inside the band."
      info:
        span: "Span — the basis for the reduced error, usually the scale's upper limit. For a 0–10 bar gauge, for example, that's 10 bar."
        cls: "Accuracy class — the allowed reduced error, in percent, printed on the instrument's dial (0.5, 1.0, 1.5…). The instrument passes if its error doesn't exceed the class."
        red: "Reduced error — error relative to the whole scale, not the current reading. This is what's compared with the accuracy class."
      note: "A green result means the reduced error is within the accuracy class (instrument passes); red means it's exceeded (reject / needs adjustment). The sign of Δ shows direction: “+” means the instrument reads high, “−” means it reads low."
      method:
        steps:
          - "Absolute error is the difference between the instrument's reading and the true value. Its sign shows whether the instrument reads high or low."
          - "Relative error is calculated from the true value; reduced error from the span — effectively, from the whole scale."
          - "It's the reduced error that's compared with the accuracy class: the instrument passes if it doesn't exceed the class."
        example: "An instrument reads 50.4 against a reference of 50 on a scale up to 100 → absolute error 0.4; relative 0.8%; reduced 0.4%. Class 0.5 allows ±0.5% — the instrument passes."
    valve-kv:
      title: "Control valve Kvs calculator: online"
      tagline: "Size a valve's flow coefficient for liquid, and check flow against a valve's Kvs."
      intro: "A control valve is sized by its flow coefficient Kv — the flow of water through a fully open valve at a 1 bar pressure drop. Enter flow rate and pressure drop — the calculator computes the required Kv, and checks what flow a chosen Kvs valve will pass."
      norm: "Kv = Q·√(ρrel/ΔP), ρrel = ρ/1000 (water = 1), Q in m³/h, ΔP in bar (GOST 23866 / IEC 60534, turbulent liquid flow). Take Kvs with a +20…30% margin over the calculated Kv."
      common_heading: "Fluid and pressure drop"
      dp: "Pressure drop across the valve, ΔP"
      rho: "Fluid density, ρ"
      rho_hint: "water 1000, petroleum products ~800"
      size_heading: "Sizing Kv by flow"
      q: "Flow rate, Q"
      result_kv: "Required Kv"
      check_heading: "Checking against valve Kvs"
      kvs: "Valve Kvs"
      result_q: "Flow it will pass"
      info:
        dp: "Pressure drop — the difference in pressure before and after the valve at the working flow rate. The smaller the drop, the higher the Kv needed."
        kvs: "Kvs — the flow capacity of a fully open valve (m³/h of water at a 1 bar drop), from the nameplate. Take it with a 20–30% margin over the calculated Kv."
        kv: "Kv — the flow coefficient your flow rate and pressure drop require. It's used to pick a valve with the nearest higher Kvs."
      method:
        steps:
          - "Kv is the flow of water through a fully open valve at a 1 bar pressure drop. It's the basis for comparing valves against each other."
          - "The required Kv grows with flow rate and falls as the pressure drop increases: the bigger the drop, the smaller a valve can handle it."
          - "Fluid density is factored in relative to water, so the multiplier equals one for water."
        example: "A flow of 10 m³/h of water at a 1 bar drop → required Kv = 10 m³/h. A valve with a nameplate Kvs of 16 will pass 16 m³/h at the same drop — a margin of about 60%."
    twisted-pair-line:
      title: "PoE calculator: line length and voltage drop"
      tagline: "PoE voltage drop, voltage at the device, and maximum length over twisted pair."
      intro: "PoE power is lost to conductor resistance over twisted pair — the device receives less than the switch outputs, and on a long line a PoE camera or access point might not power up. Choose a PoE standard and conductor gauge (AWG) — the calculator estimates voltage drop, voltage at the device, and the maximum length."
      norm: "ΔU = I·Rloop; PoE 802.3af/at — 2 pairs (Rloop = Rcond·L), 802.3bt — 4 pairs (Rcond·L/2). Channel length is capped at 100 m per ISO/IEC 11801 and GOST R 53246."
      standard: "PoE standard"
      std_af: "802.3af (PoE, 15.4 W)"
      std_at: "802.3at (PoE+, 30 W)"
      std_bt3: "802.3bt Type 3 (PoE++, 60 W)"
      std_bt4: "802.3bt Type 4 (90 W)"
      awg: "Conductor gauge"
      awg_24: "AWG 24 (0.205 mm²) — Cat5e/Cat6"
      awg_23: "AWG 23 (0.258 mm²) — Cat6/6A"
      awg_26: "AWG 26 (0.129 mm²) — patch cord"
      awg_22: "AWG 22 (0.326 mm²)"
      length: "Line length, L"
      current: "PoE current, I"
      vpse: "Source voltage, U"
      preset_hint: "blank — taken from the standard"
      result_rloop: "Loop resistance"
      result_vdrop: "Voltage drop, ΔU"
      result_vpd: "Voltage at the device"
      result_lmax: "Maximum length"
      verdict_ok: "Enough voltage reaches the device — it will power up"
      verdict_warn: "Not enough voltage — the device might not power up"
      table:
        awg_caption: "Copper conductor resistance by AWG gauge, Ω/m (DC, 20 °C)"
        poe_caption: "Power over IEEE 802.3: how many pairs carry current, the current itself, source voltage, and minimum at the device"
        col_awg: "Gauge"
        col_area: "Cross-section, mm²"
        col_ohms: "Resistance, Ω/m"
        col_std: "Standard"
        col_pairs: "Pairs used for power"
        col_current: "Current, A"
        col_source: "Source U, V"
        col_minimum: "Minimum at device, V"
      diagram_title: "The PoE line from switch to device, with the length margin"
      diagram_source: "Switch"
      diagram_device: "Device"
      diagram_scale: "Line length"
      diagram_legend: "Top — how many volts are lost in the cable and how many reach the device. Bottom — line length on the channel scale; the dashed line marks the maximum length, beyond which power runs out."
      info:
        std: "The PoE standard sets the cable's power and current: af — up to 15 W, at (PoE+) — 30 W, bt — 60–90 W. af/at use 2 pairs, bt uses all 4."
        awg: "AWG — the American Wire Gauge: the higher the number, the thinner the conductor and the greater the loss. AWG 24 is typical for Cat5e/Cat6; AWG 26 is a thin patch cord."
        vpd: "How many volts reach the device after cable losses. It must be no lower than the minimum for its PoE standard, or the device won't power up (red)."
      note: "An estimate based on DC copper conductor resistance at 20 °C; CCA (copper-clad aluminum) and heating cause greater losses. Maximum length is limited by both power and the data channel (100 m)."
      method:
        steps:
          - "Loop resistance is taken from conductor gauge and length. In 802.3af/at, power runs over two pairs; in 802.3bt, over four, with conductors working in parallel."
          - "Voltage drop is the PoE current times this resistance; what's left at the device is the source voltage minus the loss."
          - "What remains must be enough for the chosen standard's minimum, and the channel length is capped at 100 m regardless."
        example: "AWG 24, PoE+ (802.3at), 50 m → a 4.21 Ω loop, a 2.53 V drop, 47.5 V at the device against a minimum allowed 42.5 V."
    subnet:
      title: "IPv4 subnet calculator: mask, range, CIDR"
      tagline: "Address and CIDR prefix → mask, network, broadcast, range, and host count."
      intro: "When setting up an ICS network (PLCs, SCADA, HMIs), you often need to quickly carve up the address space and check whether devices fall in the same subnet. Enter an IP address and prefix — the calculator shows the mask, network address, broadcast address, range, and number of usable hosts."
      norm: "Mask from prefix /n; network = IP AND mask; broadcast = network OR wildcard. Classless addressing — RFC 4632 (CIDR); /31 and /32 — RFC 3021."
      ip: "IP address"
      prefix: "Prefix /CIDR"
      prefix_hint: "from 0 to 32 (e.g. 24 = mask 255.255.255.0)"
      diagram_title: "A 32-bit ruler of the address: network bits from the prefix on the left, host bits on the right"
      diagram_legend: "Top — the address octets, bottom — the mask octets. Filled bits belong to the network; empty ones are left for hosts."
      result_network: "Network address"
      result_mask: "Subnet mask"
      result_wildcard: "Wildcard mask"
      result_broadcast: "Broadcast address"
      result_hostmin: "First host"
      result_hostmax: "Last host"
      result_hosts: "Number of hosts"
      info:
        prefix: "CIDR prefix — how many leading bits of the address are reserved for the network number. /24 is a mask of 255.255.255.0 (24 bits for the network)."
        network: "The first address in the subnet — denotes the network itself. Never assigned to a device."
        mask: "The mask splits the address into a network number and a device number: the mask's ones are the network, the zeros are room for device addresses."
        wildcard: "The wildcard mask is the inverse of the regular one (where the mask has 0, this has 1). Needed in access control lists (ACLs) on network equipment, such as Cisco."
        broadcast: "The broadcast address — the last one in the subnet. Every device on the network receives packets sent to it; never assigned to a single device."
        hosts: "How many devices can connect in this subnet. The network address and the broadcast address don't count."
      method:
        steps:
          - "The prefix tells you how many leading bits of the address are reserved for the network number: /24 means 24 ones in the mask, i.e. 255.255.255.0."
          - "The network address comes from a bitwise AND of the address and mask; the broadcast address fills the remaining bits with ones."
          - "All addresses between them can be hosts: the network address and the broadcast address itself are never assigned to devices."
        example: "192.168.1.10/24 → network 192.168.1.0/24, mask 255.255.255.0, broadcast 192.168.1.255. Hosts run from 192.168.1.1 to 192.168.1.254 — 254 in total."
    modbus-rtu:
      title: "Modbus RTU polling time calculator: cycle and traffic"
      tagline: "Time to read registers over Modbus RTU, and how long it takes to poll every device."
      intro: "Over Modbus RTU, a master polls devices one by one, and at low baud rates a full cycle can take a noticeable amount of time — which determines how fast SCADA sees fresh data. Set the baud rate, register count, and device count — the calculator computes the time for one transaction and for the whole polling cycle."
      norm: "Request frame (FC03) — 8 bytes, response — 5 + 2·N bytes. Byte time = bits/byte ÷ baud rate; the t3.5 gap = 3.5 character times (≤ 19200 baud) or 1.75 ms (above). Transaction = (request+response)·tbyte + 2·t3.5 + slave response delay."
      baud: "Baud rate"
      format: "Frame format"
      format_11: "11 bits/character (8E1, 8O1, 8N2)"
      format_10: "10 bits/character (8N1)"
      registers: "Registers per request, N"
      devices: "Number of devices on the bus"
      delay: "Slave response delay"
      delay_hint: "processing time at the device, typically 0–20 ms"
      result_respbytes: "Response size"
      result_ttrans: "Transaction time"
      result_rate: "Polls per second"
      result_tcycle: "Full cycle for all devices"
      info:
        format: "How many bits go into one byte on the line, including overhead. 8N1 (no parity) is 10 bits; with parity or two stop bits, 11 bits."
        ttrans: "How long a single request-response exchange with one device takes. It determines how often every device can be polled."
        tcycle: "The time to poll every device in turn — this is how often SCADA data refreshes. For fast loops, cut it by raising the baud rate or reducing the register count per poll."
      note: "An estimate for reading registers (FC03) that doesn't account for error retries or RS-485/USB converter delays. Cycle time grows linearly with device count — for fast loops, raise the baud rate or reduce the number of registers per poll."
      method:
        steps:
          - "Calculate frame lengths: a read-registers request is 8 bytes, a response is 5 overhead bytes plus 2 bytes per register."
          - "Byte time is the number of bits per character divided by the baud rate; two inter-frame gaps and the device's processing time are added to the exchange."
          - "The polling cycle is one transaction's time multiplied by the number of devices on the bus — and it's what determines how fast SCADA sees fresh data."
        example: "9600 baud, 11 bits per character, 10 registers: a 25-byte response, a 45.8 ms transaction — about 22 polls per second."
    hyperfocal:
      title: "DOF and hyperfocal distance calculator"
      tagline: "Sharpness limits by focal length, aperture, and distance — accounting for sensor format."
      intro: "Only one plane in a frame is truly sharp; depth of field is an agreement about how much blur we're willing to call sharp. Set the format, focal length, aperture, and distance — the calculator computes the hyperfocal distance and the near and far limits of the sharp zone."
      norm: "H = f²/(N·c) + f, where c is the format's circle of confusion. Near limit = s·(H − f)/(H + s − 2f), far limit = s·(H − f)/(H − s); at s ≥ H the far limit goes to infinity and the near limit equals exactly H/2."
      result_h: "Hyperfocal distance H, m"
      result_near: "Near sharp limit, m"
      result_far: "Far sharp limit, m"
      result_dof: "Depth of field, m"
      result_c: "Circle of confusion c, mm"
      diagram_title: "The sharp zone from camera to infinity, with the hyperfocal point in the middle"
      diagram_hyper: "Hyperfocal"
      diagram_legend: "The distance axis is compressed so the hyperfocal point sits exactly in the middle and infinity fits on screen. The shaded stretch will render sharp; the mark is the focus point."
      info:
        h: "The distance you focus on to get sharpness from half that distance to infinity. On a wide-angle landscape shot, this lets you skip focusing altogether."
        far: "“∞” means the far limit has gone to infinity: everything from the near limit to the horizon is sharp."
        c: "An assumption about how much blur we're willing to call sharp. It depends not on the camera but on output size and viewing distance — which is why the selector above controls it."
      note: "The circle of confusion isn't a camera constant — it's an assumption about output size and viewing distance, which is why it's selectable here. A frame that's sharp in a phone feed can miss on a meter-and-a-half print."
      method:
        steps:
          - "The circle of confusion is an assumption about how much blur we're willing to call sharp. It depends on output size, not the camera."
          - "The hyperfocal distance shrinks the shorter the focal length and the more closed the aperture."
          - "Focusing on the hyperfocal distance gives sharpness from half that distance to infinity — on a wide-angle lens, this lets you skip focusing altogether."
        example: "Full frame, 25 mm at f/8 → hyperfocal 2.63 m. Focused at 3 m, sharpness starts at 1.4 m and reaches infinity."
    nd-filter:
      title: "ND filter calculator: how many stops you need"
      tagline: "ND density for shooting wide open at a shutter speed set by the 180° rule."
      intro: "In video, shutter speed is set by the frame rate and the 180° rule, so on a clear day, wide open, there's too much light even at the lowest ISO. The only way to cut it is in front of the lens — an ND filter. The calculator works out how many stops it needs to darken."
      norm: "Shutter speed by the 180° rule = 1/(2·frames per second). Stops over = EV₁₀₀ + log₂(ISO/100) − log₂(N²/t); required density = 2^(stops over)."
      result_shutter: "Shutter speed by the 180° rule"
      result_stops: "Stops of excess light"
      result_nd: "Required ND density"
      result_pick: "Nearest standard"
      result_resid: "Remainder after the filter, stops"
      verdict_ok: "No filter needed — there's no more light than this pair can handle"
      verdict_warn: "You can't hit the 180°-rule shutter speed without an ND filter — too much light"
      info:
        stops: "How many stops of light you need to cut to hold the chosen aperture at the 180°-rule shutter speed. Zero or less means no filter is needed, and the row highlights green."
        pick: "The nearest filter from the standard ND2…ND1024 range."
        resid: "How much is left to make up with aperture or ISO after fitting the nearest standard filter. Positive means the frame stays brighter than needed; negative, darker."
      note: "A variable ND at its extreme settings causes cross-polarization — a dark X-shaped cross, especially visible on wide-angle lenses. Test your filter on your widest lens and remember its working limit."
      method:
        steps:
          - "Shutter speed is set by the 180° rule: it equals half the frame rate, and you can't change it for exposure without losing natural motion blur."
          - "We calculate how many stops brighter than needed the chosen aperture-plus-ISO pair is at that shutter speed."
          - "The required filter density is two raised to that number of stops; the nearest one from the standard range is picked."
        example: "25 fps → a 1/50 shutter speed. A clear day (EV 15) at f/2.8 and ISO 100 gives 6.4 stops of excess, i.e. a density of 84 — the nearest standard is ND64, leaving 0.4 stops to make up."
    crop-factor:
      title: "Crop factor calculator: equivalent angle, DOF, and noise"
      tagline: "An honest conversion between formats — not just focal length, but aperture and noise too."
      intro: "The crop factor is usually applied only to focal length, which feeds the myth that speed doesn't change between formats. An honest conversion applies the same multiplier to three quantities at once: angle of view, depth of field, and the amount of light collected."
      norm: "Equivalent focal length = f·k, equivalent aperture for DOF = N·k, noise difference = 2·log₂(k) stops, where k is the ratio of the full-frame diagonal to the format's diagonal."
      result_feq: "Equivalent focal length"
      result_neq: "Equivalent aperture"
      result_noise: "Noise difference, stops"
      result_fov: "Diagonal angle of view"
      info:
        neq: "The aperture that would give the same background blur on full frame, at the same subject size and distance. Exposure stays the same either way — it doesn't depend on format."
        noise: "How many stops less light this format's sensor collects at the same scene exposure — simply because of its smaller area."
      note: "Exposure doesn't depend on format: f/2.8 gives the same brightness on any sensor. The aperture equivalent only describes depth of field and noise level."
      method:
        steps:
          - "Crop factor is the ratio of the full-frame diagonal to your sensor's diagonal. That's the single multiplier."
          - "It applies to more than focal length: the same number rescales aperture for depth of field too."
          - "For collected light, the difference is twice as many stops, because sensor area falls as the square."
        example: "Micro Four Thirds, a 25 mm f/1.7 lens → 50 mm full-frame equivalent by angle, f/3.4 by depth of field, and 2 stops less light collected."
    exposure-ev:
      title: "Exposure calculator: EV, shutter speed, aperture, ISO"
      tagline: "Fill in what you know — the rest gets calculated. Plus scene brightness in EV."
      intro: "The amount of light in the world is predictable and fits a short EV scale, where each unit is exactly one stop. Knowing the scene's brightness, you can work out exposure ahead of time, at home, and tell whether the shot will work at all."
      norm: "EV = log₂(N²/t) at ISO 100; at other sensitivities, EV₁₀₀ = log₂(N²/t) − log₂(ISO/100). The “sunny 16” rule: a clear day ≈ EV 15, i.e. f/16 at a shutter speed of 1/ISO."
      ev_hint: "clear day 15, overcast 12, sunset 12, blue hour 7–8, room in daytime 8–9, room in the evening 5–7"
      pair_heading: "Your combination"
      reverse_heading: "Reverse calculation from brightness"
      reverse_hint: "Set the scene's brightness — the calculator finds the missing parameter for your combination."
      result_ev: "EV₁₀₀ of your combination"
      result_tneed: "Shutter speed at your aperture and ISO, 1/"
      result_nneed: "Aperture at your shutter speed and ISO"
      result_isoneed: "ISO for your pair"
      info:
        ev: "Calculated from the aperture, shutter speed, and ISO you entered — the brightness your combination is set for."
        tneed: "The shutter speed needed at the scene's EV, aperture, and ISO you gave."
      note: "A camera's meter reads reflected light and gets fooled by unusual scenes: it turns snow gray, and a black car gray too. Knowing the expected EV is a way to catch that mistake."
      method:
        steps:
          - "EV is a scale where each unit equals exactly one stop. The pair “aperture plus shutter speed” sets the EV uniquely."
          - "Sensitivity is factored in separately, normalized to ISO 100 — that's what makes values from different cameras comparable."
          - "Knowing the scene's EV, the missing parameter — shutter speed, aperture, or ISO — is found by working backward."
        example: "f/5.6 at 1/125 and ISO 100 is EV 11.9. If the scene is actually EV 15, at the same aperture and ISO the shutter speed needed is about 1/1045."
    diffraction:
      title: "Diffraction limit: what aperture detail starts dropping at"
      tagline: "The Airy disk against pixel pitch — for your format and resolution."
      intro: "Closing the aperture suppresses aberrations, but past a point diffraction takes over: light bends around the aperture's edge, and a point renders as a spot. The calculator shows where that line sits for your sensor."
      norm: "Airy disk diameter d ≈ 2.44·λ·N at λ = 0.55 μm (green light). Pixel pitch = sensor width ÷ horizontal resolution. Diffraction starts limiting once the disk covers about two pixels."
      result_pitch: "Pixel pitch"
      result_airy: "Airy disk diameter"
      result_ratio: "Disk is bigger than the pixel by"
      result_nlimit: "Diffraction limits from"
      verdict_ok: "Diffraction isn't limiting detail yet"
      verdict_warn: "Diffraction is already softening detail — open the aperture"
      info:
        nlimit: "The aperture past which the loss of detail from diffraction becomes noticeable. The sharpness sweet spot usually sits one or two stops wider than this."
      note: "This is the diffraction limit, not the optimal aperture: below it, quality is limited by lens aberrations, which fall as you close down instead. Find your own sweet spot by testing."
      method:
        steps:
          - "Pixel pitch comes from sensor size and megapixel count: more pixels on the same area means each one is smaller."
          - "A closed aperture turns a point into an Airy disk, and its diameter grows directly with the f-number."
          - "Detail starts dropping once the disk covers about two pixels — that's where the limiting aperture comes from."
        example: "A 24 MP full-frame sensor → a 6 μm pixel pitch. At f/8 the Airy disk is 10.74 μm, or 1.8 pixels — still within limits. Diffraction starts limiting from about f/8.9."
    golden-hour:
      title: "Golden hour calculator: sunset time and azimuth"
      tagline: "When and where the sun will set at your location — plus the golden and blue hour windows."
      intro: "The golden hour isn't really an hour, or a fixed time of day — it's a range of sun elevations from +6° to −4°, where light turns sidelong, warm, and low-contrast. Enter your coordinates and date — the calculator works out when this window opens and closes, where the sun sets, and how high it climbs at noon."
      norm: "Declination δ ≈ 23.44°·sin(360°(N − 81)/365). Hour angle for an event at elevation h: cos H = (sin h − sin φ·sin δ)/(cos φ·cos δ). Sunrise and sunset are taken at h = −0.833° (refraction plus the disk's radius); golden hour runs from +6° to −4°, blue hour from −4° to −6°. Civil time comes from the correction TC = 4·(λ − 15·UTC) + the equation of time."
      locate: "Find my location"
      locate_failed: "Couldn't determine your location — enter coordinates manually"
      result_sunrise: "Sunrise"
      result_sunset: "Sunset"
      result_golden: "Golden hour"
      result_blue: "Blue hour"
      result_azset: "Sunset azimuth"
      result_azrise: "Sunrise azimuth"
      result_hmax: "Sun elevation at noon"
      info:
        golden: "The evening window is shown. The morning one mirrors it: the same span before and after sunrise. In summer in temperate latitudes, golden hour can run over an hour; near the equator, about twenty minutes."
        azset: "Measured clockwise from north: 180° is south, 270° is due west. Over the year the sunset azimuth swings by tens of degrees, so the same façade is lit differently month to month."
        hmax: "The lower the sun sits at noon, the closer the whole day gets to golden-hour light. In temperate latitudes in December, that's around 11° — a “golden day” instead of a golden hour."
      note: "The calculation doesn't account for terrain or elevation above the horizon: if a building or hill stands to the west, the sun will disappear earlier than calculated — check against satellite imagery and street-level panoramas. A dash instead of a time means polar day or polar night."
      method:
        steps:
          - "From the date we find the sun's declination — how far it's tilted from the celestial equator on that day of the year."
          - "From declination and latitude we get the hour angle for the elevation we need: −0.833° for sunrise and sunset (correcting for refraction and disk radius), +6° to −4° for golden hour, and −4° to −6° for blue hour."
          - "Solar time is converted to civil time by correcting for longitude and the equation of time — which is where the accuracy to the minute comes from."
    timelapse:
      title: "Timelapse calculator: interval, duration, storage"
      tagline: "How many frames, how many seconds of clip, and how much storage."
      intro: "In interval shooting, three quantities are tightly linked: the interval, the shooting duration, and the finished clip's length. Set two — the calculator computes the third, plus the frame count and storage needed."
      # Values are from bank C4 of the "Setting banks" article: clouds 2–5 s,
      # sunset 5–10 s, construction 30+ s. The preset picks a point, not a range.
      scene_clouds: "Clouds — 3"
      scene_sunset: "Sunset and sunrise — 5"
      scene_build: "Construction and installation — 30"
      result_frames: "Frame count"
      result_clip: "Clip duration"
      result_disk: "Storage used"
      result_needint: "Interval for the desired duration"
      info:
        needint: "What interval to use to get a clip of the desired length at the same shooting duration."
      norm: "Frames = shooting duration ÷ interval; clip duration = frames ÷ frame rate; storage = frames × frame size."
      note: "Always turn off stabilization for interval shooting: it drifts frame to frame, and the drift accumulates — the finished clip will “swim.” Set exposure and white balance manually, or auto modes will cause flicker."
      method:
        steps:
          - "Frame count is the shooting duration divided by the interval."
          - "Clip duration is the frame count divided by the clip's frame rate. Hence the rule of thumb: a minute of clip at 25 fps costs 1500 shots."
          - "The reverse problem — what interval to use to get a clip of the desired length at the same shooting duration."
        example: "An hour-long shoot at a 5 s interval → 720 frames, a 28.8 s clip at 25 fps, and 17.58 GB on the card. To fit into 20 s, the interval needs to be 7.2 s."

