  privacy:
    eyebrow: "Legal information"
    title: "Privacy Policy"
    updated: "Last updated July 2, 2026"
    intro: "This Policy explains what data we collect, why, and how we protect it. In short: we collect the minimum necessary, show no ads, and never sell your data to anyone."
    operator_title: "1. Who processes the data"
    operator_html: "<p>The data controller is the author and owner of the IndustrialProfi project (industrialprofi.com). For any questions about data processing, contact us — details are at the bottom of this page.</p>"
    data_title: "2. What data we collect"
    data_html: "<p>Only what's necessary for the service to work:</p><ul><li><strong>At sign-up</strong> — the email address and name you provide.</li><li><strong>Password</strong> is stored only as a cryptographic hash; we never see or store it in plain text.</li><li><strong>Learning progress</strong> — which articles you've marked as completed.</li><li><strong>Practice journal</strong> — your text entries. They're private and visible only to you.</li><li><strong>Technical session data</strong> — IP address and browser details, for login and account security.</li></ul>"
    purposes_title: "3. Why we use it"
    purposes_html: "<ul><li>to give you an account and save your progress and journal;</li><li>to keep login secure;</li><li>to send transactional emails — a confirmation code at sign-up, password resets, and optional reminders to continue learning (you can unsubscribe with one click from any email or from your settings).</li></ul><p>We don't use your data for advertising, and we show no ads.</p>"
    legal_title: "4. Legal basis"
    legal_html: "<p>Processing is based on the consent you give at sign-up, and on performing the agreement to use the service (Federal Law No. 152-FZ, “On Personal Data”).</p>"
    sharing_title: "5. Sharing with third parties"
    sharing_html: "<p>We <strong>do not sell or share</strong> your personal data with third parties for commercial purposes. Data is processed only by the service providers the platform can't run without:</p><ul><li><strong>hosting provider</strong> — physically hosts the site and database on its servers;</li><li><strong>email provider (SMTP)</strong> — delivers transactional emails to you;</li><li><strong>Yandex Metrica</strong> — a web analytics service: collects anonymized visit statistics (which pages people read, from what devices) so we know what to improve. This statistic isn't linked to your account.</li></ul><p>There are no ad trackers or ad networks on the site.</p>"
    storage_title: "6. Storage and protection"
    storage_html: "<p>Data is stored on a secured server, the site is accessed only over a secure connection (HTTPS), and passwords are hashed. We keep data for as long as your account exists; after you delete your account, the associated data is deleted too.</p>"
    cookies_title: "7. Cookies"
    cookies_html: "<p>We use one technical cookie — it keeps you logged in after signing in — and Yandex Metrica's cookie for anonymized visit statistics. We have no advertising cookies.</p>"
    rights_title: "8. Your rights"
    rights_html: "<p>At any time, you can:</p><ul><li><strong>view and change</strong> your name, email, and password — in <a href=\"%{account_url}\">account settings</a>;</li><li><strong>delete your account</strong> along with all associated data — in the same settings;</li><li><strong>withdraw consent</strong> for reminder emails — via the unsubscribe link in any email.</li></ul>"
    changes_title: "9. Changes to this Policy"
    changes_html: "<p>We may update this Policy. The current version is always available on this page, with the date of the last change shown at the top.</p>"
    contact_title: "10. Contact"
    contact_html: "<p>For questions about personal data processing, write to <a href=\"mailto:%{contact_email}\">%{contact_email}</a> or use the contact form on the site.</p>"

