      cta: "Become a co-author for a profession"
    pipeline_title: "What happens to your edit"
    pipeline_lead: "Nothing gets lost or broken: every edit follows a short, transparent path."
    pipeline:
      step1_title: "You suggest an edit"
      step1_desc: "Right on the article, in a convenient editor. No git, no extra software."
      step2_title: "An expert reviews it"
      step2_desc: "An experienced editor reads the edit by hand and applies it if it makes the article better."
      step3_title: "The change gets published"
      step3_desc: "And is saved in the article's history forever: you can roll it back, you can't lose it."
      step4_title: "Your name is on the article"
      step4_desc: "A quiet “improved by…” line with your name appears in the article's edit history — forever."
    ladder_title: "Trust grows with your contribution"
    ladder_lead: "The more quality edits, the more trust and access you get. That's how the project grows through the community — and how it's run by the community too."
    ladder:
      member_title: "Member"
      member_desc: "Any registered reader: suggests edits, keeps a practice journal, marks progress."
      editor_title: "Expert"
      editor_desc: "Reviews other people's edits, edits articles, and leads profession roadmaps under their own name. Status is earned by doing the work, not handed out through connections."
      admin_title: "Administrator"
      admin_desc: "Helps keep the platform in order and grants new experts their status."
    ladder_rules_title: "The same rules for everyone"
    ladder_rules:
      review: "A real, live expert reads every edit — nothing gets published automatically. And nothing gets lost: every article's edit history is kept forever and is open to everyone."
      earn: "Trust is counted only from accepted edits. It can't be asked for, bought, or gamed — not even the founder can nudge the counter."
      propose: "After %{threshold} accepted edits on a profession, the system will offer you editor rights on its own. The threshold only opens the door — a person always makes the final call."
      scope: "An expert gets rights to the specific profession they know, not to everything at once. Only administrators publish materials."
      log: "Every grant of rights and every decision on an edit is logged in the action log forever — nothing gets rewritten after the fact."
    faq_title: "Frequently asked questions"
    faq:
      - q: "Do I need to know git or programming?"
        a_html: "No. The edit system is built exactly for people who don't work with git. Open the article, click “Suggest an edit,” write it, submit it for review — that's it."
      - q: "Can I add a profession that doesn't exist here yet?"
        a_html: 'Yes — that’s the whole point of an open project. If you’re a practitioner and know a trade inside out (whether it’s electrical work or agronomy), <a href="/en/coauthor_application/new">send a co-author application</a> — we’ll sketch out the roadmap together, and you’ll lead it under your own name. Prefer to discuss it briefly first? Write to me on <a href="%{telegram_url}" target="_blank" rel="noopener">Telegram</a>.'
      - q: "Why open code and free licenses?"
        a_html: "So the project outlives its founder: free licenses make it impossible to “lock away” or lose what's been built — it's insurance for years to come. More detail in the manifesto above."
      - q: "Do I need an account?"
        a_html: "Yes, but sign-up is quick — just an email and a password. An account is needed so edits are signed with a real name: that's what makes them trustworthy, and it's how good authors unlock more access."
      - q: "I'm not sure about the wording. Should I suggest it anyway?"
        a_html: "Yes, definitely. An expert will read the edit either way — better to suggest it and point out what's off than stay quiet. Even a short note helps."
      - q: "What do I get in return?"
        a_html: "Your name quietly stays with your edit — in the article's edit history, open to every reader, forever. Not a leaderboard, not points — quiet, honest recognition of the work."
    cta_title: "Ready to get involved?"
    cta_text: "Ready to lead a section — send a co-author application. Or start small: pick a profession you know and suggest your first edit."
    cta_explore: "Browse professions"
    cta_write: "Write to the author"
    cta_support: "Support with a donation"

  faq:
    eyebrow: "Questions and answers"
    title: "FAQ"
    intro: "Honest answers to the questions we get asked most: what this project is, why it's free, what finishing a roadmap gets you, and how to help."
    items:
      - q: "What is IndustrialProfi, and why is everything free?"
        a_html: "IndustrialProfi is open career roadmaps for the skilled trades: a path from the fundamentals to a confident specialist, built from official standards (PUE, GOST, NAKS) and practical tasks. It's an open project: the code is published under the AGPL-3.0 license, the learning materials under CC BY-SA. It's free because access to learning a trade well shouldn't depend on the size of your wallet. There's no catch: no ads, no paid articles, no “premium access.” More on the <a href=\"/about\">About page</a>."
      - q: "Where do I start?"
        a_html: "Open the <a href=\"/paths\">profession catalog</a>, pick yours, and go through the articles top to bottom — the order isn't random: every article builds on the ones before it. Every article follows the same shape: why it matters → the official documents to read → the practical task to do with your hands. The main rule: one article today beats ten “someday.”"
      - q: "Will this work for me if I'm a complete beginner? What if I already work in the trade?"
        a_html: "For a beginner — yes: roadmaps are built from zero, with no “everybody already knows this” assumptions. Go in order, and don't skip the fundamentals and safety training — they're at the start for a reason, not as a formality. If you already work in the trade — go through the roadmap like a checklist: almost everyone has gaps, especially in the regulatory parts. Start with the topics where you feel least sure."
      - q: "Does completing a roadmap give me a certificate, a safety clearance, or NAKS accreditation?"
        a_html: "<strong>No — and that's important to understand.</strong> Certificates, electrical safety clearance groups, and NAKS accreditation are issued only by accredited training centers and boards — no website replaces that. What IndustrialProfi gives you is the knowledge and practice that turns the exam at a training center from a coin flip into something you're prepared for — you show up understanding what they're asking you. Anywhere the work involves voltage, pressure, or safety-critical welds, official clearance is mandatory. We say this plainly, because in the skilled trades, confidence without clearance is dangerous."
      - q: "How is this different from paid courses or trade school?"
        a_html: "We don't retell standards in our own words — we link to the primary sources and tell you exactly which chapters to read and what to do with your hands afterward. It's the “librarian, not lecturer” model. Courses and trade school give you a certificate of completion; here, you get a system of knowledge and the habit of working with regulatory documentation — a skill that stays with you after any certificate, and that you need on the job every day."
      - q: "How long does it take to finish?"
        a_html: "It depends on your pace and starting level — anywhere from a couple of months to a year. A roadmap isn't a speed marathon: articles are built around a “read → do → log the result” cycle. Consistency wins: 20–30 minutes every day beats five hours once a week. That's why the dashboard shows a day-by-day activity map, not timers and deadlines."
      - q: "Why do I need an account, and what does it give me?"
        a_html: "You can read without an account — all the content is open and stays open. An account adds working tools: “completed” marks and progress by profession, a “Continue” button that picks up where you left off, a personal practice journal, and bookmarks on articles. Signing up just takes an email and a password — nothing else."
      - q: "Can I learn from my phone?"
        a_html: "Yes, the site is fully adapted for mobile — reading articles and tracking progress works well on any device. Practical tasks are easy to work through with your phone in hand: do the work with your hands, then log the result in your journal right there."
      - q: "How do I add the app icon to my phone?"
        a_html: "You can add the site to your home screen — it'll open like a regular app, full-screen, with its own icon, no browser chrome.<br><strong>Android (Chrome):</strong> the “⋮” menu at the top right → “Install app” (or “Add to Home screen”).<br><strong>iPhone (Safari):</strong> the Share button (a square with an arrow pointing up) → “Add to Home Screen” → “Add.”<br>Your account, progress, and journal stay exactly the same — it's the same app, just a handy shortcut."
      - q: "I found a mistake or an inaccuracy in an article — what do I do?"
        a_html: "Every section of an article has a “Suggest an edit” link — all you need is a free account (the edit is submitted under your name and stays in the article's history forever), and the edit itself takes a couple of minutes. It goes to an expert for review; once accepted, every reader sees it, and you can track the fate of every edit you've made on your “My learning” dashboard. It's the fastest way to make the project better — and it's exactly how it's meant to grow."
      - q: "I'm an experienced craftsman or engineer. How can I share what I know?"
        a_html: "You're exactly who half this platform was built for. Start small: open the articles on your topic and suggest edits wherever you spot something inaccurate or know a better way. Want to do more? Write to me (“Write to the author” in the menu under your name, or Telegram at the bottom of the page): we'll talk through a section, or a whole roadmap for your profession — with your name on it as the author. Is your profession not in the catalog yet? Write to me even more so: this platform is meant for any in-demand trade where skill and practice decide the outcome — from construction to farming. Vetted specialists get expert rights and help develop the materials."
      - q: "How else can I help the project?"
        a_html: "Tell colleagues, students, and trade chats about it — for an open project, that matters more than money. You can also <a href=\"/support_us\">support it with a donation</a>: the money goes toward servers and new materials. If you're a developer — the code is open on GitHub (link in the footer), and contributions are welcome."
      - q: "Who writes the materials?"
        a_html: "Honestly: drafts of many articles are put together with an LLM — strictly from official documents (GOST, PUE, manufacturer documentation) and with links to primary sources. The idea is that the real work starts after that: practitioners review the materials, every reader edit is reviewed by an expert in the profession, and every change stays forever in the article's open history — like Wikipedia. We think it's more honest to name the tools than to hide them: an LLM speeds up the draft, while people and primary sources are responsible for accuracy. How we write is laid out in the open <a href=\"/guide\">author's guide</a>; found a mistake — suggest an edit right on the article's page."
      - q: "Who's behind this, and how do I get in touch?"
        a_html: "One person builds this project — the code, the writing, checking the materials, replying to messages. Why and how — in the <a href=\"/about\">About</a> letter. Getting in touch is simple: “Write to the author” on the site (if you're signed in) or Telegram in the footer. I read everything, and usually reply within a day or two."
    more_text: "Didn't find your question? Ask directly — that's how this list keeps growing."
    more_write: "Write to the author"
    more_telegram: "Ask on Telegram"
    more_about: "About"

  roadmap:
    page_title: "Roadmap — industrialprofi.com"
    eyebrow: "Roadmap"
    title: "Where IndustrialProfi is headed"
    intro: "IndustrialProfi is an open project, and its development should be just as open. Here, honestly: what already works, what I'm doing right now, what's planned, and what's still just an idea."
    note: "This is a living document. I don't set hard dates — for a project one person is currently building, that would be dishonest. Priorities can change, including in response to your feedback."
    groups:
      done:
        title: "Already working"
        items:
          - t: "Profession catalog and roadmaps"
            d: "A structured path through each profession — from the basics to a confident specialist."
          - t: "A thought-out article format"
            d: "Why it matters → official documents → a practical task, plus self-check questions."
          - t: "Quality source links"
            d: "Standards, books, videos, and tools with clear type badges."
          - t: "Reader edits and change history"
            d: "Anyone can suggest an improvement to an article; every accepted edit is visible in the open history. You can track the fate of your own edit on the “My learning” dashboard, and if you don't check back for a while, a single email tells you the outcome."
          - t: "Accounts and “completed” marks"
            d: "A free account with password recovery, a “completed” mark on every article, and clear progress through a profession."
          - t: "The “Practice” page"
            d: "Every practical task in one place — do the work and build up experience for your portfolio."
          - t: "Calculators and converters"
            d: "Current and cable cross-section, voltage drop, 4–20 mA scaling, unit conversion — each linked to the relevant standard and article."
          - t: "Practice journal"
            d: "A personal work log: write down what you did with your hands — private, visible only to you."
          - t: "Activity heatmap"
            d: "Squares like on GitHub: your actual day-by-day practice, no pressure."
          - t: "Come-back reminder"
            d: "If you've paused for a week, one quiet email with the next article. No newsletters, one-click unsubscribe."
          - t: "A direct line to the author"
            d: "“Write to the author” in the menu — the message comes straight to me, no middlemen; I reply by email within a day or two."
          - t: "The “My learning” dashboard"
            d: "Every profession you've started, in one place — plus a “Continue” button that picks up at the next article."
          - t: "Bookmarks on articles"
            d: "Mark an article you want to come back to — it's always within reach on your dashboard."
          - t: "Two-column reading mode"
            d: "On desktop — a table of contents with checkmarks alongside the article, so you never lose your place."
          - t: "Focused reading mode"
            d: "Clears everything else off the screen — just you and the article."
          - t: "Account settings"
            d: "Name, password, email change with confirmation, and account deletion — your data stays under your control."
          - t: "Community experts"
            d: "Vetted craftsmen get expert rights and help review edits and improve articles — the project doesn't depend on one person."
          - t: "The “How to help” page"
            d: "An open project built by practitioners: how to suggest an edit without knowing git, how to take on a whole profession, and why the code is open."
          - t: "A clean dark interface"
            d: "Clean design in plain CSS, adapted for the phone."
          - t: "Five professions in the catalog"
            d: "Electrician, welder, process-control (ASU TP) engineer, CNC machine setter-operator, and a nuclear I&C specialization for commissioning engineers — each with a full roadmap from the basics to a specialist."
          - t: "About, FAQ, and this roadmap"
            d: "An honest account of why the project exists, where it's headed, and what it actually delivers (and what it doesn't)."
          - t: "Support and partnerships"
            d: "A support page with one-time and recurring donations, and an open partners page for companies — so the project can live without ads or paywalled knowledge."
          - t: "Celebrating a finished chapter"
            d: "Finish a chapter or a whole profession, and a summary window pops up with a “Share on Telegram” button, so you can tell your colleagues."
          - t: "A page for training centers and companies"
            d: "The platform can already train students and employees — for free. Tell us what your training process needs — we build toward real demand."
          - t: "Article search"
            d: "Search for a topic, term, or document number across every article — with the match highlighted. A quick search window opens from any page: the icon in the header, or Ctrl+K."
          - t: "Glossary of abbreviations"
            d: "PUE, RCD, PLC, TIG — professional abbreviations spelled out for each profession, with an instant filter. Russian and international terms are kept apart, pairs like RCD ≈ УЗО get cross-links, and every term leads to the article where it's covered."
          - t: "Roadmap maturity gauge"
            d: "The profession page honestly shows how much you can trust it: material assembled → improved by the community → has a curator → expert-reviewed. Each step is a checkable fact — the top one is confirmed personally by a curator, and a stale review fades on its own. Your accepted edit can move a roadmap up a step — you'll see it happen on your dashboard."
          - t: "Project news"
            d: "Short notes on how the platform is living and growing — and a heart if a note resonated with you."
      progress:
        title: "In progress right now"
        items:
          - t: "Filling out the professions"
            d: "Deepening the content: more articles, worked examples, and checkable tasks."
          - t: "Diagrams and illustrations for articles"
            d: "Replacing placeholders with real diagrams — half the value is in seeing it clearly."
      planned:
        title: "Planned"
        items:
          - t: "Public profile"
            d: "An open page with completed articles and journal entries — a portfolio for an employer, publishing only what you choose to."
          - t: "Submitting practical projects"
            d: "Uploading your result (a photo, diagram, document) with moderation — a real portfolio for an employer."
          - t: "Community and your own tracks, if you're a specialist"
            d: "Experienced practitioners lead roadmaps for their own professions under their own name — any in-demand trade, from construction worker to farmer. With mandatory moderation: safety first."
          - t: "Country-specific clearance variants"
            d: "Documents for Kazakhstan and other countries — the groundwork is already in place (the country_code field)."
      future:
        title: "Ideas for the future — driven by real demand"
        items:
          - t: "Verifiable certificates"
            d: "Possibly paid — for the result, not for entry; free public verification by QR code. Only once there's demand and a reliable way to verify real professional skills and completed practical tasks."
          - t: "Specialist marketplace"
            d: "A place where experienced craftsmen and employers find each other. A big step — we'll take it once the community of practitioners has grown."
          - t: "Mentorship"
            d: "So a master craftsman can find a promising newcomer by their real work and take them on as an apprentice. A strong idea in the spirit of a trade, but it needs a mature community and real care for safety — so it comes as the project grows and demand appears."
          - t: "Self-check quizzes"
            d: "Short quizzes per article, to reinforce the material."
          - t: "More professions"
            d: "HVAC technician, CNC operator, installer, and others — driven by community demand."
          - t: "“Got an idea”"
            d: "A place where anyone can suggest an idea for the platform and vote on others' — development priorities visible in the open, not just in my head."
          - t: "Project news"
            d: "A separate feed of platform updates — what's new and what's in progress, without having to follow the git history."
          - t: "An English-language version"
            d: "Once there's an audience beyond the Russian-speaking world and real demand for it."
      not_now:
        title: "Deliberately not doing right now"
        items:
          - t: "A mobile app"
            d: "Possible, but it takes time and I'm not yet sure it's worth it. A responsive site is enough for a long while yet."
          - t: "A public API"
            d: "No real consumers yet — we'll add it once there are."
          - t: "Gamification and streaks"
            d: "Retention mechanics come once there's already an audience and content."
          - t: "Visual graph-style roadmap diagrams"
            d: "What's needed is clear lists, not flowcharts."
          - t: "Comments and a forum"
            d: "Complex dynamics and moderation to handle alone; discussion lives on Telegram for now. A full forum — later, and only with real demand and funding for moderation and servers."
    os_title: "Open source"
    os_text: "IndustrialProfi is open source. The platform, content, and progress tracking are free forever, and the code is open under the AGPL-3.0 license. All the learning materials will stay open — if paid options ever appear, they'll only be for extra services around learning, never for access to the knowledge itself."
    help_title: "How to help"
    help_text: "Suggest an edit to an article, share a craftsman's experience, tell your colleagues, support the project, or just write to me — I'm open to ideas and feedback."
    cta_about: "About"
    cta_support: "Support the project"
    cta_telegram: "Write on Telegram"

  support:
    page_title: "Support the project — industrialprofi.com"
    title: "Support the project"
    copy: "Copy"
    copied: "Copied"
    intro: "IndustrialProfi's learning materials are free and open — and will stay that way forever. I want anyone who decides to learn a useful trade to be able to study from quality materials without paying for it. Your support helps the project live, grow, and pay for its servers."
    donate_cta: "Support the project"
    github_cta: "Star on GitHub"
    github_note: "Can't donate right now? A star on GitHub is free and helps too: it makes the project more visible, and brings in new people who care about it."
    eyebrow: "Open project"
    signal: "The project is just getting started — and every donation is a vote that initiatives like this matter and should exist. Supporting it now is especially valuable: you could be one of the first to decide this has a future."
    alive_html: 'The project is only just beginning, but it’s alive and growing right in front of you — see the <a href="%{roadmap_url}">roadmap</a> and the <a href="%{github_url}" target="_blank" rel="noopener">open source code</a>.'
    give_title: "How much and how"
    give_lead: "Any amount helps, and the figures below are just a rough guide, not a precise estimate. Recurring support matters most — it's what gives the project a foundation it can rely on."
    give:
      recurring_label: "Monthly on Boosty — the project's main support"
      onetime_label: "One-time"
      r1: "the price of one cup of coffee — once a month"
      r2: "coffee with a pastry, and a month of servers for the project"
      r3: "like a lunch out — pushes new professions forward"
      o1: "keeps the server running for a couple of days"
      o2: "helps add a hands-on breakdown"
      o3: "brings a new standards-based topic closer"
      o4: "a major contribution to development"
      direct_label: "Or transfer directly — no middleman fees"
      card_label: "Card"
      yoomoney_open: "Open the form"
      direct_hint: "A direct transfer goes entirely to the project, with no service fees. Your bank will show the recipient's name at the time of transfer."
    give_note: "Recurring tiers (Supporter · Ally · Pillar) are set up on Boosty. One-time support goes through CloudTips: cards, SBP, any amount."
    vision_title: "Where we're headed"
    vision_text: "The idea is bigger than one site of articles: an open platform for structured, concentrated human experience in one place, where practitioners themselves write the roadmaps for their professions — today electrician, welder, I&C specialist, tomorrow any complex profession where skill and practice are what matter. That takes time, resources, and a community — and your support brings that moment closer, so more time can go into the project. The materials stay free forever either way."
    transparency_title: "Honest about the money"
    transparency_text: "Once a quarter I'll openly show how much came in and where it went. There are no donations yet — the first report will appear once there's something to report. Openness about money is part of why this project is open at all."
    company_title: "Are you a company or organization?"
    company_text: "One-time support through CloudTips is capped at 5,000 ₽. Companies have a separate path: support the project more substantially or on an ongoing basis, and get a thank-you on the partners page."
    company_cta: "Corporate partnership"
    faq_title: "Frequently asked questions"

    q_how_money: "What will the money be used for?"
    a_how_money: "The money goes toward servers, the domain, and infrastructure, but mainly toward new content: finding, checking, and structuring official standards and practical tasks. That takes a great deal of time, and every donation helps buy that time instead of forcing me toward other projects for lack of funding."

    q_how_donate: "How can I support the project?"
    a_how_donate: "You can support it through CloudTips — cards, SBP, and other payment methods. A one-time payment or a recurring subscription — any amount helps."

    q_why_free: "Why is the project free?"
    a_why_free: "I'm convinced access to quality trade education shouldn't depend on the size of your wallet. Official standards — GOST, PUE, PTEEP — are public. My job is just to gather them into a clear path, add practice, and make the learning clear. That should be available to everyone."

    q_paid: "Will paid features ever appear?"
    a_paid: "Possibly: over time, the project may add optional paid services — a specialist marketplace, say, or extra tools — so it can live without ads and not depend only on donations. But the learning materials themselves — the texts, standards, tasks — have been and will remain free and open to everyone. You will never have to pay to learn from them."

    q_surplus: "What if donations bring in more than needed?"
    a_surplus: "Anything above what's needed goes toward development: new professions, improving existing materials, a progress-tracking system, and a mobile app."

    q_other_help: "I can't donate. How else can I help?"
    a_other_help_html: 'The most valuable contribution isn’t money — it’s knowledge. If you’re a practitioner, suggest an edit or take on leading a whole profession — all of that is on the <a href="%{contribute_url}">contribute page</a>. And tell colleagues about the project and share the link in trade chats: that’s how the people who need it find out about it. It’s open source, too — developers are welcome.'

    q_who_created: "Who's behind IndustrialProfi?"
    a_who_created_html: 'So far, I build the project alone — the code, the writing, the design, supporting people on Telegram. Why and how I took this on is laid out in detail in the <a href="%{about_url}">“About” letter</a>. Got an idea to make it better or more convenient — write to me directly.'

    q_contact: "How do I get in touch with you?"
    a_contact_html: 'Write to me on <a href="%{telegram_url}" target="_blank" rel="noopener">Telegram</a>. I reply within a couple of days.'

  partners:
    title: "For partners"
    intro: "IndustrialProfi is growing as an open, independent project. We're glad to work with companies and organizations that share the idea of accessible, quality trade education."
    independence_title: "The independence principle"
    independence_text: "Support means recognition and a logo, not influence over content. Our recommendations for standards and tools stay honest and unbiased, no matter who's supporting the project. That's exactly the trust this project exists for."
    empty_invite: "This is where the companies and organizations that help the project live and grow will appear. There are no partners yet — yours could be the first."
    tiers:
      gold: "Gold partners"
      silver: "Silver partners"
      bronze: "Bronze partners"
      community: "Community partners"
    cta_title: "Support us as a company"
    cta_text_html: "We're interested in steady, long-term growth. If you think our project <strong>matters for the industry</strong> and you're ready to support us <strong>regularly and visibly</strong> — write to us: for ongoing, substantial support, we'll place <strong>your company's logo on the homepage too</strong>. You'll be helping train qualified specialists, and you'll get a thank-you here, on the partners page. Support doesn't have to be money — testing equipment, training stands, internships, or ideas for real-world tasks from your shop floor all count."
