    title: "How to help"
    intro: "IndustrialProfi is an independent, open-source project: both the code and the materials are free. Profession roadmaps don't have to be written from scratch — what matters is that practitioners review and correct them. My goal is to give you the platform and a convenient builder to do that. Here's how to plug in at any level."
    manifesto1: "Unfortunately, no single person on Earth can physically describe dozens of professions accurately, well, and usefully. I only really know what I've actually worked in myself. That's why the project is built as a shared, open resource: code under the free AGPL-3.0 license, materials under CC BY-SA 4.0. If something happens to me, the project can be forked and continued — it won't die with its founder."
    manifesto_highlight: "This is a shared resource we're building together, one that should, in theory, outlive any one of us."
    manifesto2: "The platform is deliberately built to hold any complex, modern trade where skill and practice are what matter. Today that's electrician, welder, instrumentation tech; tomorrow — agronomist, farmer, mechanic. Only someone who's lived a trade themselves can review and validate its roadmap. If your trade isn't here yet — its roadmap starts with you: the experience you've gathered over the years becomes the road for the people who come after."
    ways_title: "Levels of involvement"
