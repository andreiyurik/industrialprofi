  authors:
    title: "For authors and experts"
    eyebrow: "For authors and experts"
    meta_description: "What a craftsman who leads a profession on IndustrialProfi gets: a name in the profession's history and header, influence over the canon of the trade, and the apprentices they train."
    hero_title: "A profession is described by someone who's lived it"
    hero_intro: "Not a theorist, not an editor — a craftsman. You know the trade from the inside, and you'll build the roadmap for a profession — all of it, or your own section within it — that people learn from seriously, under your name, for the long haul."
    frame1: "IndustrialProfi is an open, shared resource: code under AGPL-3.0, materials under CC BY-SA 4.0, free for readers, with no ads. We don't write textbooks from scratch — we gather the best official documents and practice into the right order. What's missing is one thing: practitioners who know that order."
    frame_highlight: "Leading a profession means leaving your mark on the canon of your trade — not \"submitting an article to someone else's website.\""
    frame2: "The platform is built to outlive any one of us: if the project ever needs to continue without its founder, it can be forked and carried on. Your contribution won't vanish along with the site."
    benefits_title: "What you get"
    benefits_lead: "What a craftsman gains when their experience becomes a profession's roadmap."
    benefits:
      name:
        title: "A name that stays"
        text: "Authorship lives in every article's edit history and, if you want, in the profession's header. Credit is locked in by the CC BY-SA license: it can't be erased, and it lives on even if you leave. It's recognition, not a scoreboard chase — no rankings, no competitions."
      canon:
        title: "You set the standard for the profession, and give it transparency."
        text: "You decide the order standards come in, which sources are best, and what actually matters versus what doesn't. You're not tweaking someone else's text bit by bit — you're structuring the profession (or your section of it) the way it should actually be taught to your peers."
      practice:
        title: "You train the next generation — with their hands"
        text: "You add practical tasks as close to the real job as possible, so newcomers build real skill at the bench, not just in theory. Your instinct reaches people who have nowhere else to get it."
      routine:
        title: "We handle all the routine"
        text: "Servers, domain, editor, drafts, the review system — that's on us. What we need from you is expertise, not IT skills: no git, no page layout, no extra software."
      role:
        title: "A real role and real rights"
        text: "Expert status and edit access to your profession — or the section you lead. A complex profession is carried by several craftsmen, each their own part: you're on a team, not out there alone. The more you contribute, the more you can do."
      tooling:
        title: "A real tool, not a text file"
        text: "A professional editor and a source builder: every point gets the right link type (standard, book, video, tool) and a note on exactly what to look at. Every edit is saved forever, like git: full history is visible, you can roll it back, you can't lose it. No tool like this exists anywhere else in the world for the skilled trades today."
    showcase:
      label: "Sources for the article"
      sources:
        - type: norm
          kind: "Standard"
          title: "PUE, Chapter 1.7"
          note: "Grounding and protective measures — sections 1.7.51–1.7.103"
        - type: video
          kind: "Video"
          title: "How to read a single-line diagram"
          note: "12 minutes, with a walkthrough of the notation"
        - type: tool
          kind: "Tool"
          title: "qModMaster"
          note: "check sensor polling over Modbus"
      history: "Edit history: 14 versions · last one 3 days ago · one-click rollback"
      caption: "This is how the builder assembles sources: each has its own type and a note on exactly what to look at. And any edit is saved forever."
    who_title: "Who this is for"
    who_lead: "One condition: a deep trade where knowledge, skill, and practice are what matter. You don't have to carry a whole profession alone — you can take a single section."
    who:
      - "You've worked in the trade yourself — with your hands, tripped over every mistake there is, not just read about it."
      - "You're willing to honestly cite standards, best practice, and quality sources — not make things up."
      - "You want your experience to outlive you and help the people who come next, and the trade to keep improving."
    steps_title: "How to start"
    steps_lead: "Three steps — I'll walk you through the rest personally."
    steps:
      - title: "Send an application"
        desc: "Short version: which profession, your experience, and why it matters to you. A couple of minutes."
      - title: "We'll agree on the format"
        desc: "I'll reply personally, grant you Expert status, and help with your first section."
      - title: "You lead the profession"
        desc: "Under your own name, in a convenient editor, with a full edit history."
    why_now_title: "Why now, specifically"
    why_now_body: "The world is entering a competency crisis: old-school craftsmen are fewer every year, and there's often no one and nowhere to train the next generation, or the quality falls short. And at the same time, for the first time, the experience of the world's best specialists — Germany, Japan, the Netherlands, the US — is available to anyone willing to seek it out. Our job is to gather it in one place, laid out clearly and in Russian: to keep your own skills sharp, and to raise the bar for the people coming up behind you."
    why_now_highlight: "Brick by brick, that's how our industry — and the infrastructure around it — gets a little more competent. It's a contribution that outlives us. Our cities get better built, our plants more efficient, and our people more skilled by world standards — and maybe, just maybe, a little happier too."
    cta_title: "Ready to lead your profession?"
    cta_text: "If your trade isn't here yet — its roadmap starts with you."
    cta_apply: "Send an application"
    cta_contribute: "How it all works"

  contribute:
