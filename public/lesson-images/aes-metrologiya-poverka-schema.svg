<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 384" role="img" aria-label="Цикл поверки датчика на АЭС: демонтаж в контролируемой зоне, вынос из КЗ, мастерская метрологии, сличение с эталоном, свидетельство о поверке, возврат и монтаж; через межповерочный интервал цикл повторяется">
  <style>
    text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#ededed}
    .box{fill:#161616;stroke:#2e2e2e;stroke-width:1.5}
    .head{fill:#11161c;stroke:#3d9bff;stroke-width:1.5}
    .edge{stroke:#7d7d7d;stroke-width:1.75;fill:none}
    .loop{stroke:#7d7d7d;stroke-width:1.5;fill:none;stroke-dasharray:4 4}
    .ttl{font-size:14px;font-weight:700}
    .sub{fill:#a1a1a1;font-size:11px}
    .tag{fill:#3d9bff;font-size:11px;font-weight:600}
    .icon{stroke:#3d9bff;stroke-width:1.6;fill:none}
    .zone{stroke:#2e2e2e;stroke-width:1;fill:none}
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7d7d7d"/></marker>
  </defs>

  <!-- return loop: cycle repeats after the calibration interval -->
  <text class="tag" x="430" y="26" text-anchor="middle">через МПИ цикл повторяется — межповерочный интервал задаёт проект, а не паспорт прибора</text>
  <path class="loop" d="M785 76 V42 H75 V76" marker-end="url(#ah)"/>

  <!-- STEP 1: sensor in place -->
  <rect class="box" x="15" y="76" width="120" height="112" rx="9"/>
  <text class="tag" x="26" y="96">1</text>
  <circle class="icon" cx="75" cy="100" r="10"/>
  <path class="icon" d="M75 100 l6 -6"/>
  <path class="icon" d="M75 110 v10 M68 120 h14"/>
  <text class="ttl" x="75" y="146" text-anchor="middle">Датчик</text>
  <text class="ttl" x="75" y="164" text-anchor="middle">на месте</text>
  <text class="sub" x="75" y="208" text-anchor="middle">демонтаж по</text>
  <text class="sub" x="75" y="224" text-anchor="middle">регламенту</text>

  <path class="edge" d="M135 132 H157" marker-end="url(#ah)"/>

  <!-- STEP 2: carry out of the controlled zone -->
  <rect class="box" x="157" y="76" width="120" height="112" rx="9"/>
  <text class="tag" x="168" y="96">2</text>
  <path class="icon" d="M209 92 h-8 v24 h8"/>
  <path class="icon" d="M207 104 H231 M225 98 l6 6 l-6 6"/>
  <text class="ttl" x="217" y="146" text-anchor="middle">Вынос</text>
  <text class="ttl" x="217" y="164" text-anchor="middle">из КЗ</text>
  <text class="sub" x="217" y="208" text-anchor="middle">доза и время в зоне</text>
  <text class="sub" x="217" y="224" text-anchor="middle">ограничены</text>

  <path class="edge" d="M277 132 H299" marker-end="url(#ah)"/>

  <!-- STEP 3: metrology workshop -->
  <rect class="box" x="299" y="76" width="120" height="112" rx="9"/>
  <text class="tag" x="310" y="96">3</text>
  <path class="icon" d="M345 100 l14 -10 l14 10"/>
  <path class="icon" d="M347 100 v16 h24 v-16"/>
  <path class="icon" d="M356 116 v-7 h6 v7"/>
  <text class="ttl" x="359" y="146" text-anchor="middle">Мастерская</text>
  <text class="ttl" x="359" y="164" text-anchor="middle">метрологии</text>
  <text class="sub" x="359" y="208" text-anchor="middle">или специально</text>
  <text class="sub" x="359" y="224" text-anchor="middle">оборудованный пост</text>

  <path class="edge" d="M419 132 H441" marker-end="url(#ah)"/>

  <!-- STEP 4: comparison with the reference (accented) -->
  <rect class="head" x="441" y="76" width="120" height="112" rx="9"/>
  <text class="tag" x="452" y="96">4</text>
  <path class="icon" d="M501 90 v22 M494 112 h14"/>
  <path class="icon" d="M489 94 h24"/>
  <path class="icon" d="M489 94 l-4 9 h8 z M513 94 l-4 9 h8 z"/>
  <text class="ttl" x="501" y="146" text-anchor="middle">Сличение</text>
  <text class="ttl" x="501" y="164" text-anchor="middle">с эталоном</text>
  <text class="sub" x="501" y="208" text-anchor="middle">эталонный калибратор:</text>
  <text class="sub" x="501" y="224" text-anchor="middle">Beamex MC6, Fluke 754</text>

  <path class="edge" d="M561 132 H583" marker-end="url(#ah)"/>

  <!-- STEP 5: calibration certificate -->
  <rect class="box" x="583" y="76" width="120" height="112" rx="9"/>
  <text class="tag" x="594" y="96">5</text>
  <rect class="icon" x="634" y="88" width="18" height="26" rx="2"/>
  <path class="icon" d="M639 96 h8 M639 102 h8"/>
  <path class="icon" d="M638 108 l3 3 l6 -6"/>
  <text class="ttl" x="643" y="146" text-anchor="middle">Свидетельство</text>
  <text class="ttl" x="643" y="164" text-anchor="middle">о поверке</text>
  <text class="sub" x="643" y="208" text-anchor="middle">привязано к номеру</text>
  <text class="sub" x="643" y="224" text-anchor="middle">и позиции по KKS</text>

  <path class="edge" d="M703 132 H725" marker-end="url(#ah)"/>

  <!-- STEP 6: return and mounting -->
  <rect class="box" x="725" y="76" width="120" height="112" rx="9"/>
  <text class="tag" x="736" y="96">6</text>
  <path class="icon" d="M785 92 a12 12 0 1 0 12 12"/>
  <path class="icon" d="M797 104 l-6 -3 M797 104 l5 -6"/>
  <text class="ttl" x="785" y="146" text-anchor="middle">Возврат</text>
  <text class="ttl" x="785" y="164" text-anchor="middle">и монтаж</text>
  <text class="sub" x="785" y="208" text-anchor="middle">сверка паспортной</text>
  <text class="sub" x="785" y="224" text-anchor="middle">погрешности до ввода</text>

  <!-- zone brackets -->
  <path class="zone" d="M15 243 v5 h262 v-5"/>
  <text class="tag" x="146" y="266" text-anchor="middle">контролируемая зона (КЗ)</text>
  <path class="zone" d="M299 243 v5 h404 v-5"/>
  <text class="tag" x="501" y="266" text-anchor="middle">вне контролируемой зоны</text>
  <path class="zone" d="M725 243 v5 h120 v-5"/>
  <text class="tag" x="785" y="266" text-anchor="middle">снова в КЗ</text>

  <!-- footer notes -->
  <path d="M15 290 H845" stroke="#2e2e2e" stroke-width="1"/>
  <text class="sub" x="430" y="318" text-anchor="middle">Результат поверки: протокол + свидетельство с МПИ до следующей поверки — при ПНР входят в исполнительную документацию</text>
  <text class="sub" x="430" y="338" text-anchor="middle">Для канала безопасности датчику также нужен действующий EQR — без него монтаж запрещён, даже со свежим свидетельством</text>
  <text class="sub" x="430" y="358" text-anchor="middle">Свидетельства проверяет надзор (Ростехнадзор, на Аккую — NDK): просрочка ведёт к останову блока</text>
</svg>
