<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" role="img" aria-label="Слева карьерная лестница инженера ПНР из четырёх ступеней: инженер без категории, инженер 2 категории, инженер 1 категории, ведущий инженер — с ростом ответственности кверху. Справа четыре направления ПНР «Атомтехэнерго»: ОВиК, электротехническое, АСУ ТП и КИПиА (выделено как тема этого пути), технологическое.">
  <style>
    text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#ededed}
    .box{fill:#161616;stroke:#2e2e2e;stroke-width:1.5}
    .top{fill:#11161c;stroke:#3d9bff;stroke-width:1.75}
    .edge{stroke:#7d7d7d;stroke-width:1.75;fill:none}
    .ttl{font-size:14px;font-weight:700}
    .sub{fill:#a1a1a1;font-size:11px}
    .col{fill:#3d9bff;font-size:12px;font-weight:600}
    .lvl{fill:#3d9bff;font-size:10px;font-weight:700}
    .arrow{stroke:#3d9bff;stroke-width:2;fill:none}
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3d9bff"/></marker>
  </defs>

  <!-- column headers -->
  <text class="col" x="20" y="34">Карьерная лестница</text>
  <text class="col" x="460" y="34">Направления ПНР «Атомтехэнерго»</text>
  <path d="M20 44 H840" stroke="#2e2e2e" stroke-width="1"/>

  <!-- ЛЕВО: восходящая стрелка -->
  <path class="arrow" d="M44 376 L44 52" marker-end="url(#ah)"/>
  <text class="lvl" x="60" y="52" transform="rotate(-90 60 52)" text-anchor="end">рост ответственности</text>

  <!-- ступень 4 (верх): ведущий инженер -->
  <rect class="box" x="88" y="58" width="290" height="66" rx="9"/>
  <text class="ttl" x="233" y="85" text-anchor="middle">Ведущий инженер</text>
  <text class="sub" x="233" y="107" text-anchor="middle">руководит направлением на объекте</text>

  <!-- ступень 3 -->
  <rect class="box" x="88" y="142" width="290" height="66" rx="9"/>
  <text class="ttl" x="233" y="169" text-anchor="middle">Инженер 1 категории</text>
  <text class="sub" x="233" y="191" text-anchor="middle">сложные системы, протоколы</text>

  <!-- ступень 2 -->
  <rect class="box" x="88" y="226" width="290" height="66" rx="9"/>
  <text class="ttl" x="233" y="253" text-anchor="middle">Инженер 2 категории</text>
  <text class="sub" x="233" y="275" text-anchor="middle">типовые операции самостоятельно</text>

  <!-- ступень 1 (низ) -->
  <rect class="box" x="88" y="310" width="290" height="66" rx="9"/>
  <text class="ttl" x="233" y="337" text-anchor="middle">Инженер без категории</text>
  <text class="sub" x="233" y="359" text-anchor="middle">старт: работа под руководством</text>

  <!-- связи между ступенями -->
  <path class="edge" d="M233 142 V124"/>
  <path class="edge" d="M233 226 V208"/>
  <path class="edge" d="M233 310 V292"/>

  <!-- ПРАВО: направление 1 — ОВиК -->
  <rect class="box" x="460" y="58" width="380" height="72" rx="9"/>
  <text class="ttl" x="478" y="87">ОВиК</text>
  <text class="sub" x="478" y="109">вентиляция гермозоны, спецвентиляция, климат</text>

  <!-- направление 2 — электротехническое -->
  <rect class="box" x="460" y="146" width="380" height="72" rx="9"/>
  <text class="ttl" x="478" y="175">Электротехническое</text>
  <text class="sub" x="478" y="197">электрооборудование, кабельные трассы, питание</text>

  <!-- направление 3 — АСУ ТП / КИПиА (наше) -->
  <rect class="top" x="460" y="234" width="380" height="86" rx="9"/>
  <text class="lvl" x="478" y="257">НАШЕ НАПРАВЛЕНИЕ — ТЕМА ЭТОГО ПУТИ</text>
  <text class="ttl" x="478" y="280">АСУ ТП и КИПиА</text>
  <text class="sub" x="478" y="302">автоматика, КИП, контроллеры, защиты, SCADA</text>

  <!-- направление 4 — технологическое -->
  <rect class="box" x="460" y="336" width="380" height="72" rx="9"/>
  <text class="ttl" x="478" y="365">Технологическое</text>
  <text class="sub" x="478" y="387">насосы, арматура, теплообменники, трубопроводы</text>

  <!-- footer note -->
  <path d="M20 432 H840" stroke="#2e2e2e" stroke-width="1"/>
  <text class="sub" x="430" y="460" text-anchor="middle">Лестница категорий одна и та же внутри каждого из четырёх направлений</text>
</svg>
