<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" role="img" aria-label="Пирамида классов безопасности элементов АЭС по НП-001-15: класс 1 наверху (тепловыделяющие элементы, теплоноситель первого контура) — самые жёсткие требования; класс 2 (защитная оболочка, САОЗ, первый контур, уровень в парогенераторе) — резервирование 2oo3, квалификация EQR, жёсткая документация; класс 3 (системы, важные для безопасности, защита турбины по оборотам) — резервирование по проекту, квалификация, поверка с надзором; класс 4 (нормальная эксплуатация, большинство КИП второго контура) — стандартные требования без обязательного резервирования; стрелка справа показывает рост строгости требований кверху">
  <style>
    text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#ededed}
    .tier{fill:#161616;stroke:#2e2e2e;stroke-width:1.5}
    .top{fill:#11161c;stroke:#3d9bff;stroke-width:1.5}
    .ttl{font-size:14px;font-weight:700}
    .sub{fill:#a1a1a1;font-size:11px}
    .req{fill:#ededed;font-size:12px}
    .reqsub{fill:#a1a1a1;font-size:11px}
    .col{fill:#3d9bff;font-size:12px;font-weight:600}
    .link{stroke:#2e2e2e;stroke-width:1;stroke-dasharray:4 4;fill:none}
    .edge{stroke:#7d7d7d;stroke-width:1.75;fill:none}
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7d7d7d"/>
    </marker>
  </defs>

  <!-- column headers -->
  <text class="col" x="300" y="34" text-anchor="middle">Классы безопасности по НП-001-15 (ОПБ)</text>
  <text class="col" x="736" y="34" text-anchor="middle">Требования к элементу</text>
  <path d="M20 44 H840" stroke="#2e2e2e" stroke-width="1"/>

  <!-- tier 1: класс 1 (узкий, строгий, акцент) -->
  <polygon class="top" points="205,64 395,64 435,160 165,160"/>
  <text class="ttl" x="300" y="100" text-anchor="middle">Класс 1</text>
  <text class="sub" x="300" y="122" text-anchor="middle">тепловыделяющие элементы,</text>
  <text class="sub" x="300" y="138" text-anchor="middle">теплоноситель первого контура</text>

  <!-- tier 2: класс 2 -->
  <polygon class="tier" points="155,172 445,172 485,268 115,268"/>
  <text class="ttl" x="300" y="208" text-anchor="middle">Класс 2</text>
  <text class="sub" x="300" y="230" text-anchor="middle">защитная оболочка, САОЗ, первый контур;</text>
  <text class="sub" x="300" y="246" text-anchor="middle">уровень в парогенераторе (по нему идёт защита)</text>

  <!-- tier 3: класс 3 -->
  <polygon class="tier" points="105,280 495,280 535,376 65,376"/>
  <text class="ttl" x="300" y="316" text-anchor="middle">Класс 3</text>
  <text class="sub" x="300" y="338" text-anchor="middle">системы, важные для безопасности;</text>
  <text class="sub" x="300" y="354" text-anchor="middle">защита турбины по оборотам</text>

  <!-- tier 4: класс 4 -->
  <polygon class="tier" points="55,388 545,388 585,484 15,484"/>
  <text class="ttl" x="300" y="424" text-anchor="middle">Класс 4 — нормальная эксплуатация</text>
  <text class="sub" x="300" y="446" text-anchor="middle">большинство КИП тепловой автоматики второго контура:</text>
  <text class="sub" x="300" y="462" text-anchor="middle">расходомеры, термопреобразователи, манометры</text>

  <!-- dashed links tier → requirements -->
  <path class="link" d="M428 112 H598"/>
  <path class="link" d="M478 220 H598"/>
  <path class="link" d="M528 328 H598"/>
  <path class="link" d="M578 436 H598"/>

  <!-- up axis: строгость растёт кверху -->
  <path class="edge" d="M612 474 V76" marker-end="url(#ah)"/>

  <!-- requirements per tier -->
  <text class="req" x="634" y="106">Самые жёсткие требования,</text>
  <text class="reqsub" x="634" y="123">максимальная строгость контроля</text>

  <text class="req" x="634" y="206">2oo3 · квалификация (EQR)</text>
  <text class="reqsub" x="634" y="223">жёсткая документация,</text>
  <text class="reqsub" x="634" y="239">поверка с участием надзора</text>

  <text class="req" x="634" y="314">Резервирование по проекту</text>
  <text class="reqsub" x="634" y="331">квалификация, поверка</text>
  <text class="reqsub" x="634" y="347">с участием надзора</text>

  <text class="req" x="634" y="422">Стандартные требования</text>
  <text class="reqsub" x="634" y="439">без обязательного</text>
  <text class="reqsub" x="634" y="455">резервирования и EQR</text>

  <!-- footer note -->
  <path d="M20 504 H840" stroke="#2e2e2e" stroke-width="1"/>
  <text class="sub" x="430" y="530" text-anchor="middle">Чем меньше номер класса, тем строже резервирование, квалификация и документация.</text>
  <text class="sub" x="430" y="548" text-anchor="middle">Класс задан проектом по НП-001, а не наладчиком</text>
</svg>
