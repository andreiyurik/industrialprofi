<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-label="Измерение уровня в парогенераторе ВВЭР: горизонтальный корпус ПГ, отбор «плюс» снизу и «минус» сверху к двухкамерному дифманометру, уравнительный сосуд на минусовой линии держит постоянный столб конденсата; справа три независимых канала голосуют два из трёх на защиту">
  <style>
    text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#ededed}
    .box{fill:#161616;stroke:#2e2e2e;stroke-width:1.5}
    .head{fill:#11161c;stroke:#3d9bff;stroke-width:1.5}
    .tank{fill:#161616;stroke:#2e2e2e;stroke-width:1.75}
    .liquid{fill:#11161c}
    .edge{stroke:#7d7d7d;stroke-width:1.75;fill:none}
    .wave{stroke:#3d9bff;stroke-width:1.75;fill:none}
    .ttl{font-size:14px;font-weight:700}
    .lbl{font-size:12px;font-weight:600}
    .sub{fill:#a1a1a1;font-size:11px}
    .col{fill:#3d9bff;font-size:12px;font-weight:600}
    .tag{font-size:11px;font-weight:700;fill:#3d9bff}
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7d7d7d"/></marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3d9bff"/></marker>
    <clipPath id="pg"><rect x="30" y="120" width="290" height="140" rx="70"/></clipPath>
  </defs>

  <!-- column headers -->
  <text class="col" x="30" y="30">Схема измерения (один канал из трёх)</text>
  <text class="col" x="590" y="30">Резервирование 2oo3</text>
  <path d="M20 40 H840" stroke="#2e2e2e" stroke-width="1"/>
  <path d="M565 52 V430" stroke="#2e2e2e" stroke-width="1"/>

  <!-- ===== steam generator: horizontal vessel ===== -->
  <text class="sub" x="30" y="110">ПГ ВВЭР — горизонтальный корпус</text>
  <rect class="tank" x="30" y="120" width="290" height="140" rx="70"/>
  <rect class="liquid" x="30" y="195" width="290" height="65" clip-path="url(#pg)"/>
  <line x1="31" y1="195" x2="319" y2="195" stroke="#3d9bff" stroke-width="1.5"/>
  <text class="sub" x="185" y="152" text-anchor="middle">насыщенный пар</text>
  <text class="sub" x="195" y="237" text-anchor="middle">вода · ~280 °C · 60+ бар</text>
  <!-- level height -->
  <path class="wave" d="M110 199 V255" marker-start="url(#ahb)" marker-end="url(#ahb)"/>
  <text class="tag" x="100" y="231" text-anchor="end">H</text>

  <!-- ===== minus impulse line (steam phase, top) ===== -->
  <path class="edge" d="M248 120 V70 H491" marker-end="url(#ah)"/>
  <text class="sub" x="268" y="62">«минус»: сверху — только пар</text>

  <!-- equalizing vessel on the minus line -->
  <rect class="head" x="495" y="52" width="36" height="46" rx="8"/>
  <line x1="497" y1="66" x2="529" y2="66" stroke="#3d9bff" stroke-width="1.5"/>
  <path class="edge" d="M513 98 V301" marker-end="url(#ah)"/>
  <text class="tag" x="500" y="138" text-anchor="end">уравнительный сосуд:</text>
  <text class="sub" x="500" y="154" text-anchor="end">постоянный столб конденсата</text>
  <text class="sub" x="500" y="169" text-anchor="end">пар конденсируется, излишек</text>
  <text class="sub" x="500" y="184" text-anchor="end">переливается обратно —</text>
  <text class="sub" x="500" y="199" text-anchor="end">опорная точка не «гуляет»</text>

  <!-- ===== plus impulse line (water phase, bottom) ===== -->
  <path class="edge" d="M190 260 V330 H426" marker-end="url(#ah)"/>
  <text class="sub" x="205" y="322">«плюс»: снизу — пар + столб воды</text>

  <!-- ===== differential pressure transmitter ===== -->
  <rect class="box" x="430" y="305" width="110" height="60" rx="9"/>
  <line x1="485" y1="310" x2="485" y2="360" stroke="#2e2e2e" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text class="tag" x="457" y="340" text-anchor="middle" font-size="14">+</text>
  <text class="tag" x="513" y="340" text-anchor="middle" font-size="14">−</text>
  <text class="sub" x="485" y="386" text-anchor="middle">двухкамерный дифманометр (ΔP)</text>

  <!-- ===== 2oo3 voting block ===== -->
  <text class="sub" x="590" y="56">три независимых канала уровня</text>

  <rect class="box" x="590" y="64" width="150" height="44" rx="9"/>
  <text class="lbl" x="602" y="83">Канал 1 — LT</text>
  <text class="sub" x="602" y="99">своя точка отбора</text>

  <rect class="box" x="590" y="124" width="150" height="44" rx="9"/>
  <text class="lbl" x="602" y="143">Канал 2 — LT</text>
  <text class="sub" x="602" y="159">своя точка отбора</text>

  <rect class="box" x="590" y="184" width="150" height="44" rx="9"/>
  <text class="lbl" x="602" y="203">Канал 3 — LT</text>
  <text class="sub" x="602" y="219">своя точка отбора</text>

  <rect class="head" x="760" y="114" width="80" height="64" rx="9"/>
  <text class="ttl" x="800" y="143" text-anchor="middle">2oo3</text>
  <text class="sub" x="800" y="161" text-anchor="middle">два из трёх</text>

  <path class="edge" d="M740 86 L756 128" marker-end="url(#ah)"/>
  <path class="edge" d="M740 146 H756" marker-end="url(#ah)"/>
  <path class="edge" d="M740 206 L756 164" marker-end="url(#ah)"/>

  <path class="edge" d="M800 178 V226" marker-end="url(#ah)"/>
  <rect class="box" x="740" y="230" width="120" height="46" rx="9"/>
  <text class="lbl" x="800" y="249" text-anchor="middle">Защита</text>
  <text class="sub" x="800" y="266" text-anchor="middle">останов блока</text>

  <text class="sub" x="712" y="302" text-anchor="middle">Защита срабатывает, когда выход</text>
  <text class="sub" x="712" y="318" text-anchor="middle">за уставку показали 2 канала из 3.</text>
  <text class="sub" x="712" y="340" text-anchor="middle">Одиночный отказ не даёт ложного</text>
  <text class="sub" x="712" y="356" text-anchor="middle">останова и не маскирует аварию</text>

  <!-- footer: formula -->
  <path d="M20 445 H840" stroke="#2e2e2e" stroke-width="1"/>
  <text class="sub" x="430" y="475" text-anchor="middle">ΔP = «плюс» (пар + столб воды) − «минус» (пар + постоянный столб конденсата) → уровень H</text>
  <text class="sub" x="430" y="497" text-anchor="middle">Поправка по плотности ρ(P) от датчика давления PT переводит «сырой» ΔP в реальный уровень</text>
</svg>
