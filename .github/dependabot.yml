version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  # Minor and patch bumps land in one weekly PR; a major bump gets its own so it's read before merging.
  groups:
    gems:
      update-types: [minor, patch]
    gems-major:
      update-types: [major]
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  groups:
    actions:
      patterns: ["*"]
