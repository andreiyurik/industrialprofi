  lesson: praktika_shchitok
  excluded: true

expert_pteep:
  map: expert_map
  lesson: pteep
  note: "Только главы 1.1–1.4"

expert_link:
  map: expert_map
  after_lesson: pteep
  title: "Регламент участка"
  url: "https://example.com/reglament.pdf"
  note: "Разделы 2 и 4"
  position: 1
