tagline: "Вода, тепло — и ни одной капли мимо."
about: |
  Слесарь-сантехник монтирует и обслуживает внутренние инженерные системы здания: холодную и горячую воду, канализацию, отопление. Он читает проект, выбирает трубу под задачу — сталь, медь, полипропилен, сшитый полиэтилен, чугун или ПВХ для стоков, — соединяет её правильным способом, выставляет уклоны, опрессовывает систему и сдаёт её так, чтобы не текло ни сейчас, ни через десять лет.

  Работа есть в каждом доме: новостройка и ремонт, управляющая компания и аварийная служба, котельная и промышленный объект. Аварийный сантехник чинит то, что сломалось, монтажник строит с нуля — навыки общие, характер работы разный.

  В России квалификация растёт по разрядам (2–6) и профстандартам; главные документы — СП 30.13330 по внутреннему водопроводу и канализации и СП 73.13330 по монтажу санитарно-технических систем. Карта ведёт от охраны труда и инструмента к самостоятельному монтажнику.
highlights:
  - "**Читает проект и аксонометрию:** диаметры, уклоны, отметки — и видит, где ошибка на бумаге станет лужей на полу"
  - "**Соединяет любую трубу** правильным способом: резьба, пайка ПП, пресс, обжим, раструб — и знает, где какой допустим"
  - "**Собирает водоснабжение** с разводкой, фильтрами, счётчиками и запорной арматурой по СП 30.13330"
  - "**Кладёт канализацию с уклоном**, вентиляцией стояка и ревизиями — чтобы не пахло и не засорялось"
  - "**Монтирует отопление:** радиаторы, коллектор, балансировка, опрессовка — и сдаёт систему по акту"
  - "**Работает безопасно** с резьбой, паяльником, горячей водой и в тесных шахтах"
pros:
  - "Спрос постоянный и повсеместный: вода нужна всем, работа не уходит в онлайн"
  - "Быстрый вход: базовые навыки и первые заказы — за месяцы"
  - "Видимый результат: включил, проверил, сухо — готово"
  - "Гибкость: бригада застройщика, управляющая компания, своё ИП или частная практика"
  - "Нормативы открыты: СП, ГОСТ и инструкции производителей доступны бесплатно"
cons:
  - "Грязно и тесно: подвалы, шахты, старые стояки, засоры — это часть работы"
  - "Аварийные вызовы ночью и в выходные — в УК и аварийной службе это норма"
  - "Ответственность за чужое имущество: твоя течь — затопленные соседи снизу"
  - "Тяжёлый инструмент и материалы: чугун, стальные трубы, радиаторы, ручной труд"
  - "На частном рынке много халтуры — репутацию придётся строить делами"
history: |
  Водопровод старше большинства ремёсел: римские акведуки и канализация Cloaca Maxima работали две тысячи лет назад, а английское слово plumber идёт от латинского plumbum — свинца, из которого римляне тянули трубы. В России первый городской водопровод, Мытищинский, пришёл в Москву в 1804 году, Петербург получил свой в 1863-м; массовым ремесло стало с многоэтажным строительством XX века.

  Последние тридцать лет изменили материал, а не суть: сталь и чугун потеснили полипропилен, сшитый полиэтилен и пресс-фитинги, к системам добавились коллекторы и счётчики. Но уклон, давление и герметичность подчиняются той же физике, что и в Риме.
faq: |
  ### Можно ли начать без образования?
  Да — многие приходят учеником в бригаду или управляющую компанию и растут до разряда по факту работы. Колледж или курсы ускоряют, но не заменяют руки. Карта даёт теорию и нормативы, чтобы ученик понимал, что делает, а не только «держал».

  ### Что купить из инструмента для начала?
  Минимум: разводные и трубные ключи, труборез, паяльник для полипропилена, рулетка, уровень, набор ключей и отвёрток. Дорогой пресс-инструмент — позже, под реальные заказы. В практических заданиях карты есть честные списки с ценами и заменами.

  ### Полипропилен, металлопластик или сталь?
  Зависит от системы, давления, температуры и доступа: ПП — дёшево и надёжно при правильной пайке, PEX и пресс — быстро и без огня, сталь — где нужна прочность и требует норма. Карта разбирает каждый материал с его условиями применения, а не ищет «лучший».

  ### Как быстро можно работать самостоятельно?
  Простые работы — замена смесителя, подключение сантехники — через несколько месяцев практики. Полная разводка квартиры или отопление дома под ключ — год-два опыта и понимания нормативов. Ответственные узлы сначала делай под присмотром.

  ### Сколько зарабатывает сантехник?
  Сильно зависит от города, формата (УК, бригада, частник) и репутации, поэтому мы не публикуем цифры — они устаревают быстрее статьи. Посмотри свежие вакансии и объявления по своему региону: это честнее любого среднего.
