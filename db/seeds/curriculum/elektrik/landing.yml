tagline: "Ток идёт туда, куда ты скажешь."
about: |
  Электрик монтирует, подключает и обслуживает электроустановки — от квартирного щитка до распределительного устройства цеха. Он читает схему, прокладывает кабель, собирает щит, измеряет сопротивление изоляции и петлю «фаза-ноль», ищет, почему «выбивает автомат», и делает так, чтобы больше не выбивало.

  Работа есть везде, где есть розетка: стройка и управляющая компания, завод и больница, метро и дата-центр. Бытовой электрик чаще один на объекте и сам отвечает за результат; промышленный работает в бригаде по нарядам-допускам, где каждое действие расписано правилами.

  В России путь задаётся двумя шкалами. Группа по электробезопасности (II–V) определяет, что тебе разрешено: II — работать в бригаде, III — самостоятельно в установках до 1000 В, IV — руководить работами и отвечать за электрохозяйство, V — то же в установках выше 1000 В. Разряд (2–6) отражает квалификацию. Эта карта ведёт от группы II к уверенной IV.
highlights:
  - "**Читает схемы** — однолинейные, принципиальные, монтажные — и собирает щит по ним, а не «по памяти»"
  - "**Знает ПУЭ и ПТЭЭП** не наизусть, а где что искать: сечение, автомат, УЗО, заземление — по документу"
  - "**Измеряет, а не гадает:** сопротивление изоляции, петля «фаза-ноль», УЗО — и заполняет протокол"
  - "**Монтирует аккуратно:** соединения по ГОСТ, маркировка, запас кабеля — чтобы следующий электрик сказал спасибо"
  - "**Работает безопасно** по наряду-допуску и пяти шагам отключения — это то, что отличает живого электрика"
  - "**Объясняет заказчику**, почему так, а не иначе, — ссылаясь на норму, а не на «я так всегда делаю»"
pros:
  - "Работа есть в любом городе и не уходит в онлайн: розетку удалённо не поставишь"
  - "Быстрый вход: группа II и первые деньги — за месяцы, а не годы"
  - "Понятный рост: группа, разряд, специализация (промышленная электрика, ЦОД, релейная защита)"
  - "Результат виден сразу — собрал щит, включил, работает"
  - "Документы открыты и бесплатны: ПУЭ, ПТЭЭП, ГОСТ — учись по первоисточнику"
cons:
  - "Риск реальный: электротравма не прощает спешки и «я на секунду»"
  - "Физически тяжело: штробы, лестницы, подвалы, чердаки, зимой — на улице"
  - "Бумажная дисциплина: наряды, журналы, протоколы — половина работы промышленного электрика"
  - "Ответственность личная: за пожар от твоей скрутки отвечаешь ты"
  - "Рынок бытовых услуг шумный: квалификацию придётся доказывать делами, а не словами"
history: |
  В 1876 году Павел Яблочков показал в Париже «электрическую свечу» — первые массовые дуговые лампы, а в 1882-м в Нью-Йорке заработала станция Эдисона на Перл-стрит: появилась профессия человека, который тянет провода от станции к лампе. В России её масштаб задал план ГОЭЛРО 1920 года: за десять лет страна покрылась сетями, и понадобились десятки тысяч монтёров.

  Правила, по которым электрик работает сегодня, родились из аварий и пожаров первых десятилетий: сначала ведомственные инструкции, потом единые ПУЭ, действующее седьмое издание которых собирается главами с конца 1990-х. Главное в профессии за сто лет не изменилось: ток невидим, и только дисциплина делает его безопасным.
faq: |
  ### С чего начать, если я ноль?
  С первой главы — электробезопасность. Не потому что «так положено», а потому что без группы II тебя не пустят ни на один объект, а её дают после обучения и проверки знаний. Параллельно — основы электротехники: закон Ома, мощность, однофазная и трёхфазная сеть.

  ### Нужно ли училище или можно самому?
  Группу по электробезопасности присваивает комиссия предприятия или учебного центра; разряд — тоже. Формально диплом не обязателен, практически работодателю важнее группа, стаж и руки. Карта даёт знания для аттестации, но саму её не заменяет.

  ### Сколько учиться до первой работы?
  До группы II и места помощника в бригаде — 2–4 месяца плотной теории и практики на стенде. До самостоятельной работы (группа III) — обычно год в поле. Дальше рост идёт через объекты, а не через учебники.

  ### Бытовой или промышленный — куда идти?
  Бытовой — свобода, разнообразие, общение с заказчиком, но и поиск клиентов на тебе. Промышленный — стабильность, бригада, строгие правила, сменный график. Карта даёт общую базу для обоих, дальше — отдельные главы-специализации.

  ### Сколько зарабатывает электрик?
  Цифры зависят от региона, группы и объекта и устаревают за год, поэтому мы их не публикуем. Смотри свежие вакансии по своему городу с фильтром по группе допуска — это честнее любого среднего.
