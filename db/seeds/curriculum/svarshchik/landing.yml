about: |
  Сварщик соединяет металл в конструкции, которым доверяют вес и давление: трубопроводы, мосты, корпуса судов, каркасы зданий, рамы машин. Его работа — шов, который не видно, пока он держит, и который заметят все, если нет.

  Основных способов четыре, и карта проходит три из них: ручная дуговая сварка покрытым электродом (РД) — универсальная и «уличная»; полуавтомат в защитном газе (МИГ/МАГ) — быстрый и цеховой; аргонодуговая (ТИГ) — точная и чистая, для нержавейки и алюминия. Четвёртый, газовая сварка, остаётся в ремонте и резке. Дальше — металлы и свариваемость, дефекты и контроль, чертежи и технологические карты.

  В России рост идёт по разрядам (2–6), а допуск к ответственным объектам — через аттестацию НАКС: без неё не пустят на трубопровод, котёл, опасный производственный объект. Международный эквивалент — ISO 9606. Карта ведёт от первого шва до аттестации.
highlights:
  - "**Варит РД, МИГ/МАГ и ТИГ** — выбирает способ под металл, толщину и положение, а не «чем привык»"
  - "**Читает чертёж и техкарту:** обозначение шва по ГОСТ, катет, разделка кромок, последовательность"
  - "**Знает металл:** углеродистая, легированная, нержавейка, алюминий — и почему каждая варится по-своему"
  - "**Видит дефект до контролёра:** поры, непровар, подрез, трещина — знает причину и как не допустить"
  - "**Варит по требованиям** ГОСТ 5264, ГОСТ 14771, ISO 5817 — и готов сдать шов на рентген"
  - "**Бережёт себя:** вентиляция, защита глаз и кожи, работа с баллонами — безопасность как привычка"
pros:
  - "Дефицит реальный и мировой: квалифицированного сварщика ждут везде, от судоверфи до вахты"
  - "Ремесло переносимое: аттестация по ISO 9606 понятна в любой стране"
  - "Рост измерим: разряд, аттестация, новый способ сварки — каждая ступень открывает объекты"
  - "Результат осязаем: конструкция стоит, труба держит давление — это сделал ты"
  - "Стандарты открыты: ГОСТ и документы НАКС лежат в свободном доступе"
cons:
  - "Вредность: дым, ультрафиолет, искры, жара; защита — не опция, а условие долгой карьеры"
  - "Физически тяжело: неудобные положения, потолочные швы, монтаж на высоте и на холоде"
  - "Вахты и командировки — нормальный режим на стройке и в нефтегазе"
  - "Аттестация платная и срочная: НАКС продлевают, каждый новый способ сдают заново"
  - "К ответственной работе допускают не после курсов, а после лет практики и аттестации"
history: |
  Дуговую сварку изобрели в России: в 1881 году Николай Бенардос показал соединение металла угольным электродом, а в 1888-м Николай Славянов заменил его плавящимся металлическим — так родился способ, которым варят до сих пор. Покрытый электрод (1900-е), сварка в защитных газах (1940-е) и автоматическая сварка под флюсом Евгения Патона, которой в войну варили корпуса Т-34, сделали профессию массовой.

  Вторая половина XX века — эпоха правил: ГОСТы на швы и электроды, разряды, а с 1990-х — единая система аттестации НАКС и международные ISO. Сварщик перестал быть просто рабочим с держаком: за его швом стоит документ, а за документом — ответственность.
faq: |
  ### Можно ли научиться варить дома?
  Базовую РД — да: инвертор, маска-хамелеон, пачка электродов и пластины из металлоприёмки. Первые десятки часов — наплавка валиков и стыковые швы в нижнем положении. Но без вытяжки и защиты не начинай, а ответственные швы дома не варят никогда.

  ### Что такое НАКС и когда она нужна?
  Национальное агентство контроля сварки — система аттестации, без которой не допустят к опасным производственным объектам: трубопроводам, котлам, подъёмным сооружениям. Сдаётся отдельно по способу, группе металла и положению, действует ограниченный срок. На стройке и в цеху по ГОСТ можно работать и без неё.

  ### С какого способа начинать?
  С ручной дуговой: она учит читать ванну и дугу, прощает скромное оборудование и нужна везде. МИГ/МАГ быстрее освоить, но без понимания РД будешь «ехать на настройках». ТИГ — третьим, когда руки уже держат дугу.

  ### Как быстро можно получить разряд?
  Второй-третий разряд дают после курсов и практики за несколько месяцев; четвёртый-пятый — годы на реальных объектах и аттестации. Карта даёт теорию и самопроверку, разряд присваивает комиссия по результатам работы.

  ### Вредно ли это для здоровья?
  Да, если пренебрегать защитой: сварочный дым, ультрафиолет, шум. При вытяжке, маске, спецодежде и регулярных медосмотрах сварщики работают до пенсии — и во вредных условиях она наступает раньше. Поэтому безопасность у нас в первой главе.
