about: |
  Автомеханик обслуживает и ремонтирует автомобили, а хороший автомеханик сначала понимает, что именно сломалось. Устройство двигателя, трансмиссии, подвески и тормозов, электрика и электроника, компьютерная диагностика по OBD-II, сканером и осциллографом — это то, что отличает диагноста от «меняльщика запчастей».

  Работа есть в каждом городе: дилерский центр, независимый сервис, грузовой парк, своё дело. Путь обычно идёт от слесаря по ТО через ремонт узлов к диагностике, мастеру-приёмщику или руководителю сервиса; многие открывают свой бокс.

  Карта построена вокруг системного поиска неисправности, официальных требований к техническому состоянию (ГОСТ 33997-2016, ТР ТС 018/2011) и регламентов ТО. Ремонт двигателей, альтернативные силовые установки и мотоциклы — отдельные специализации-надстройки.
highlights:
  - "**Понимает автомобиль как систему:** двигатель, трансмиссия, ходовая, тормоза, электрика — и как они связаны"
  - "**Диагностирует по алгоритму:** симптом → система → проверка → причина, а не «давай заменим и посмотрим»"
  - "**Читает данные сканера** и осциллографа: коды OBD-II, живые параметры, осциллограммы датчиков"
  - "**Знает электрику:** мультиметр, схема, поиск обрыва и утечки — половина современных поломок здесь"
  - "**Делает ТО по регламенту** производителя и проверяет техсостояние по ГОСТ 33997, а не «на глаз»"
  - "**Работает безопасно:** подъёмник, стойки, топливо, тормозная жидкость, аккумулятор — без «и так сойдёт»"
pros:
  - "Спрос есть везде: машин больше, чем сервисов, а диагностов мало"
  - "Интересно: каждая неисправность — задача, а современный автомобиль — компьютер на колёсах"
  - "Понятная лестница: слесарь → механик → диагност → мастер или своё дело"
  - "Навык переносимый: марки разные, физика и OBD-II общие"
  - "Результат немедленный: клиент уехал, машина работает"
cons:
  - "Физически тяжело и грязно: масло, холод в боксе, тяжёлые узлы, согнутая спина"
  - "Инструмент и оборудование дорогие, а в независимом сервисе часто свои"
  - "Клиент не всегда понимает, за что платит: диагностику, где «ничего не заменили», продавать сложно"
  - "Темп и давление: нормо-часы, очередь, ответственность за чужую безопасность на дороге"
  - "Техника меняется быстро: гибриды, электромобили, новые протоколы — учиться придётся постоянно"
history: |
  Профессия родилась вместе с автомобилем: в 1886 году Карл Бенц запатентовал свой Motorwagen, а конвейер Форда 1913 года сделал машину массовой — и понадобились те, кто её чинит. Долгие десятилетия это было ремесло слуха и рук: карбюратор, трамблёр, щуп и ключ.

  Перелом — электроника: с 1996 года в США стандарт OBD-II сделал обязательным единый диагностический разъём, с 2001-го похожее требование пришло в Европу. Автомобиль начал сам сообщать о неисправности, и механику пришлось научиться читать данные. Сегодня шина CAN, десятки блоков управления и гибридные силовые установки — норма, а хороший диагност ценнее хорошего ключа.
faq: |
  ### С чего начать новичку?
  С устройства автомобиля и безопасности в боксе — первая глава. Потом тормоза и электрика: это самые частые работы и самый быстрый путь к пониманию системы. Диагностику — после, иначе сканер покажет код, а что с ним делать, будет непонятно.

  ### Нужен ли диплом автотехникума?
  Не обязателен: в сервис берут учеником и смотрят на руки и голову. Диплом помогает в дилерских центрах и для роста до мастера. Карта даёт системную базу, которой часто не хватает и выпускникам.

  ### Нужен ли дорогой сканер, чтобы учиться?
  Для старта — нет: адаптер ELM327 и телефон покажут коды и живые параметры, а осциллограф и дилерский сканер — позже, под реальные задачи. Важнее понимать, что означает то, что видишь.

  ### Диагност и механик — разные специальности?
  Всё чаще да: диагност ищет причину, механик выполняет ремонт. Но лучший диагност — тот, кто сам крутил гайки, а лучший механик понимает, зачем диагност попросил проверить массу. Карта растит второго из первого.

  ### Электромобили убьют профессию?
  Нет, изменят: меньше масла и поршней, больше высоковольтной электрики, электроники и программного обеспечения. База — устройство, электрика, диагностика по шине — остаётся; специализация по силовым установкам в карте вынесена отдельно.
