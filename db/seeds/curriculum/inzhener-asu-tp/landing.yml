tagline: "Сделать так, чтобы завод работал сам."
about: |
  Инженер АСУ ТП строит и поддерживает системы, которые ведут технологический процесс без человека на каждой задвижке: датчики измеряют, контроллер решает, исполнительные механизмы действуют, а оператор видит всё на экране SCADA. Котельная, водоканал, пищевое производство, нефтехимия, атомная станция — везде, где процесс нужно вести непрерывно и точно.

  В работе три слоя: полевой (датчики, клапаны, частотники, кабель и шкафы), контроллерный (ПЛК и программа по МЭК 61131-3, регуляторы, блокировки) и верхний (сети, SCADA, архивы, отчёты). Инженер должен понимать все три — чтобы искать неисправность не наугад, а по схеме, и проектировать систему, которую потом можно обслуживать.

  Путь обычно начинается с КИПиА или наладки: младший инженер, инженер, ведущий, руководитель проекта или главный специалист. Карта даёт вендор-нейтральную базу; специализация на конкретной платформе (Siemens, Rockwell, CODESYS) — следующий шаг.
highlights:
  - "**Читает и рисует схемы:** функциональная, принципиальная, шкаф автоматизации — по ГОСТ 21.208 и серии 34"
  - "**Программирует ПЛК** на языках МЭК 61131-3: LD для логики, ST для алгоритмов, FBD для регулирования"
  - "**Настраивает ПИД-регулятор** осознанно: понимает объект, а не крутит коэффициенты, пока не перестанет качаться"
  - "**Знает промышленные сети:** Modbus, PROFINET, OPC UA — и умеет посмотреть кадр в Wireshark, когда «не опрашивается»"
  - "**Строит SCADA**, которую оператор понимает с первого взгляда: тревоги, тренды, архивы — без лишнего"
  - "**Проводит ПНР** по программе и сдаёт систему с документами, а не «работает, подпишите»"
pros:
  - "На стыке электрики, программирования и технологии — скучно не бывает"
  - "Нужен в любой отрасли с непрерывным процессом; навык переносится между заводами и странами"
  - "Стандарты открыты: МЭК 61131-3, ГОСТ 34, документация контроллеров — учись по первоисточнику"
  - "Понятная карьера: инженер → ведущий → руководитель проектов или главный специалист"
  - "Много задач решается головой за столом, не только руками в шкафу"
cons:
  - "ПНР — это командировки, ночные пуски и ответственность за остановленное производство"
  - "Ошибка дорогая: неверная блокировка — это авария, а не баг в интерфейсе"
  - "Зоопарк платформ: у каждого вендора своя среда, лицензии и привычки"
  - "Большая доля бумаги: проект, программа ПНР, акты, протоколы — по ГОСТ и требованиям заказчика"
  - "Порог входа выше, чем у рабочих профессий: нужны физика, электротехника и базовое программирование"
history: |
  Автоматика старше компьютера: регулятор Уатта на паровой машине (1788) держал обороты без человека, а в XX веке заводы управлялись шкафами реле, которые переделывали неделями при каждом изменении техпроцесса. В 1969 году появился первый программируемый контроллер Modicon 084 — по заказу General Motors, чтобы менять логику программой, а не проводами. Так родилась профессия.

  1980–90-е принесли промышленные сети и SCADA, 1993-й — стандарт МЭК 61131-3, унифицировавший языки ПЛК, а ГОСТ серии 34 задал в России порядок создания автоматизированных систем. Сегодня к этому добавились Ethernet в цехе, OPC UA и кибербезопасность — но суть та же: датчик, контроллер, механизм, человек у экрана.
faq: |
  ### Нужен ли диплом инженера?
  Для должности «инженер» в большинстве компаний — да, профильное высшее или среднее специальное. Но в АСУ ТП приходят и из электриков, и из КИПиА, и из программистов: знания проверяют на собеседовании задачами, а не корочкой. Карта закрывает базу, которой часто нет даже у выпускников.

  ### С какого контроллера начинать?
  С любого, который можно потрогать: учебный ПЛК, симулятор CODESYS, открытый OpenPLC. Важнее понять МЭК 61131-3 и логику процесса — конкретный бренд потом осваивается за недели. Поэтому карта вендор-нейтральна.

  ### Это программирование или электрика?
  И то, и другое, и ещё технология. Половина отказов «в программе» оказывается обрывом в клеммнике, половина «электрических» — ошибкой в блокировке. Хороший инженер АСУ ТП ходит по всем трём этажам.

  ### Сколько учиться до первой работы?
  При базе в электротехнике — полгода-год плотной учёбы до позиции младшего инженера или наладчика. До самостоятельного ведения объекта — два-три года в поле. Карта рассчитана на первый этап.

  ### Чем АСУ ТП отличается от КИПиА?
  КИПиА — полевой уровень: приборы, их монтаж, поверка, калибровка. АСУ ТП — система целиком, включая контроллер, сети и SCADA. Первая глава карты — как раз КИПиА: без неё не понять, откуда берутся сигналы.
