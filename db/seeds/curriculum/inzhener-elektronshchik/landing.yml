about: |
  Инженер-электронщик доводит электронное изделие от идеи до железа: считает схему, разводит плату, паяет прототип и готовит его к серийному производству. Он одинаково уверенно работает с даташитом резистора и с системой контрактного производства (EMS), которая соберёт тысячу плат по его чертежам.

  Работает в R&D-отделах производителей электроники, в стартапах со своим железом, на контрактных производствах (EMS) и как независимый разработчик — берёт заказ на прототип и доводит его до серии. Набор инструментов один и тот же везде: CAD-система (обычно KiCad), паяльная станция, осциллограф, логический анализатор.

  Рост в профессии — от рабочей ступени «слесарь-сборщик радиоэлектронной аппаратуры и приборов» (профстандарт 40.009, монтаж и пайка по готовой документации) до инженера-конструктора 3-й, 2-й и 1-й категории (профстандарт 29.015 «Специалист по конструированию радиоэлектронных средств»): категория растёт вместе со сложностью изделий, которые доверяют вести самостоятельно — от одной платы до законченного устройства с корпусом, испытаниями и документацией на производство.
highlights:
  - "**Считает схему**, а не подбирает компоненты наугад — резистор, транзистор, стабилизатор выбираются по даташиту и расчёту"
  - "**Разводит печатную плату** в KiCad с оглядкой на технологичность и ЭМС, а не только «лишь бы дорожки не пересекались»"
  - "**Паяет и принимает пайку** по критериям IPC-A-610 — знает разницу между «работает» и «годно по классу 2»"
  - "**Программирует микроконтроллер** — от Arduino для быстрого прототипа до bare-metal STM32, когда нужна предсказуемость"
  - "**Готовит изделие к серии**: Gerber, BOM, спецификация на производство, испытания на ЭМС и климатику"
  - "**Читает документацию как родной язык** — даташит, application note, ЕСКД — и объясняет решение через них, а не «я так привык»"
pros:
  - "Результат можно подержать в руках — от идеи до работающего прототипа иногда неделя"
  - "Порог входа ниже, чем кажется: паяльник и Arduino стоят как поход в кино, а KiCad бесплатен"
  - "Растущий спрос на фоне импортозамещения электроники в СНГ"
  - "Путь напрямую ведёт в собственный продукт — многие железные стартапы начинались с одного инженера и паяльника"
  - "Квалификация переносима между странами — стандарты IPC одни и те же везде"
cons:
  - "Оборудование для серьёзной практики (осциллограф, паяльная станция, отладочные платы) стоит дороже, чем в «бумажных» профессиях"
  - "Индустрия быстро меняется: компонент, актуальный сегодня, через три года снят с производства"
  - "Путь от прототипа к серии длинный и бюрократический — сертификация, испытания, поиск контрактного производства"
  - "Английский обязателен: даташиты и стандарты IPC в основном на нём"
  - "Ошибка в разводке платы стоит денег и времени — плата с браком не чинится, её выбрасывают и заказывают заново"
history: |
  Профессия оформилась вместе с самой электроникой — от ламповых приёмников 1920-х к транзисторным схемам 1950-х и интегральным микросхемам 1960-х, которые впервые отделили «схемотехнику» (что делает устройство) от «монтаж» (как его физически собрать). Персональные CAD-системы для проектирования плат в 1980-х и открытые платформы вроде Arduino в 2005-м резко снизили порог входа: то, что раньше требовало заводской лаборатории, теперь помещается на столе.

  В СНГ профессия долго существовала в двух не связанных мирах — заводской «слесарь-сборщик радиоэлектронной аппаратуры» по ЕСКД и любительский радиокружок. Профстандарт «Специалист по конструированию радиоэлектронных средств» (2020) впервые формально описал инженерную ступень между ними: того, кто не просто паяет по чужой схеме, а сам её проектирует и доводит до производства.
faq: |
  ### С чего начать, если у меня только руки и любопытство?
  С пайки. Дешёвый набор для тренировки (300–800 ₽) и час практики дают первую проверяемую обратную связь в профессии — работает то, что ты спаял, или нет. Параллельно — Arduino: за один вечер можно зажечь светодиод своим кодом, и это меняет отношение к железу.

  ### Обязателен ли диплом?
  Формально профстандарт 29.015 требует высшего образования для инженерной ступени, но рабочая ступень (слесарь-сборщик) и первая практика — нет. Многие разработчики начинали самоучками; портфолио собранных и работающих устройств значит больше, чем строчка в резюме.

  ### Чем эта карта отличается от «Инженера АСУ ТП»?
  Масштабом. Инженер-электронщик проектирует само устройство — плату, схему, корпус. Инженер АСУ ТП собирает из готовых устройств (датчиков, контроллеров, приводов) систему управления заводом. Интереснее «что внутри коробки» — сюда; «как коробки говорят друг с другом на производстве» — туда.

  ### А если я хочу проектировать сами микросхемы?
  Это другая профессия и другой рынок труда — разработка кристаллов (RTL, Verilog/VHDL, топология) и работа с ПЛИС требуют своего пути и инструментов. Эта карта учит тому, что стоит между «идея» и «серийная плата», а не тому, что внутри самой микросхемы.

  ### Сколько стоит начать практиковаться по-настоящему?
  Паяльник и макетка для первых глав — 1500–3000 ₽. Плата STM32 для главы про bare-metal — от 300–500 ₽ (клоны). Первая своя печатная плата, заказанная на фабрике, — от 500–1000 ₽ за партию в 5–10 штук. Осциллограф и логический анализатор дороже (от 3000 ₽ за начальный уровень) — карта отмечает, где без них можно обойтись, а где нельзя.
