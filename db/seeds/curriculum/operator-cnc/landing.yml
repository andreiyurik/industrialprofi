tagline: "Из заготовки — в деталь с точностью до сотки."
about: |
  Оператор-наладчик станков с ЧПУ превращает чертёж в деталь: читает допуски и шероховатость, подбирает инструмент и режимы резания, пишет или правит управляющую программу, привязывает инструмент и нули, запускает станок и проверяет первую деталь микрометром. Токарный, фрезерный, обрабатывающий центр — принцип один, кнопки разные.

  Работа есть везде, где что-то делают из металла: машиностроение, авиация, оборонка, медицина, небольшие цеха с тремя станками. Оператор ведёт уже отлаженный процесс; наладчик ставит задачу с нуля и отвечает за то, чтобы деталь пошла в размер с первого раза. Карта ведёт от первого ко второму.

  В России квалификация измеряется разрядом (2–6) и профстандартом 40.026; на практике — тем, насколько сложную деталь и с какой точностью ты сдаёшь ОТК без брака.
highlights:
  - "**Читает чертёж** по ЕСКД: базы, допуски по ГОСТ 25347, посадки, шероховатость — и понимает, что критично"
  - "**Понимает резание:** материал, инструмент, скорость, подача, глубина — режимы считает, а не подбирает «на слух»"
  - "**Пишет и правит G-код** вручную на стойке Fanuc или Siemens и понимает, что сделает каждая строка"
  - "**Делает наладку:** привязка инструмента и нулевой точки, корректоры, пробный проход — без страха и без брака"
  - "**Измеряет правильно:** штангенциркуль, микрометр, нутромер, калибры — и знает, когда чему верить"
  - "**Работает безопасно** у вращающегося металла: ограждения, стружка, СОЖ, зажим — без исключений"
pros:
  - "Производство растёт, а готовых операторов мало — спрос стабильный"
  - "Голова важнее силы: это работа с чертежом, программой и измерением"
  - "Понятный рост: оператор → наладчик → технолог-программист ЧПУ"
  - "Результат точный и осязаемый: деталь в допуске — значит, ты сделал всё правильно"
  - "Навык универсальный: стойки разные, но G-код и резание одинаковы на любом заводе"
cons:
  - "Сменный график и цех: шум, СОЖ, стружка, 8–12 часов на ногах у станка"
  - "Цена ошибки — сломанный инструмент или запоротая дорогая заготовка, иногда шпиндель"
  - "Монотонность в серии: одна деталь тысячу раз, и внимание нельзя отпускать"
  - "Много устаревшего парка: не везде современные стойки и инструмент"
  - "Вход в сложные детали долгий: пятикоординатная обработка — это годы, не курсы"
history: |
  Первый станок с числовым программным управлением собрали в MIT в 1952 году по идее Джона Парсонса — для точных лопастей вертолётов, которые вручную не получались. В 1956-м японская Fanuc выпустила первую серийную систему ЧПУ, а в 1960-х американская EIA стандартизировала язык команд — тот самый G-код. В СССР станки с ЧПУ массово пошли на заводы в 1970–80-е.

  Микропроцессор в 1970-х превратил ЧПУ из шкафа с перфолентой в стойку с экраном, а CAD/CAM с 1990-х позволил получать программу прямо из 3D-модели. Но и сегодня станок делает ровно то, что сказал человек: понимать резание, чертёж и код всё так же необходимо.
faq: |
  ### Нужно ли уметь программировать?
  Ровно настолько, чтобы читать и править G-код: это несколько десятков команд, а не язык общего назначения. Карта учит писать простые программы вручную — без этого не понять, что делает CAM и почему станок «поехал не туда».

  ### Можно ли учиться без станка?
  Теорию, чертежи, допуски, режимы и G-код — да, с симулятором. Но наладка и чувство станка приходят только у станка: ищи учебный центр, колледж или цех, где возьмут учеником. Карта размечает, что делать на бумаге, а что — в металле.

  ### Оператор и наладчик — это разные люди?
  На больших заводах часто да: наладчик ставит процесс, оператор ведёт. В малых цехах один человек делает всё. Карьерно наладчик — следующая ступень, и именно туда ведёт карта.

  ### Fanuc или Siemens — что учить?
  Обе стойки на рынке, логика одинакова, синтаксис отличается в деталях. Начни с той, что стоит рядом; карта показывает обе. Освоив одну, вторую берёшь за недели.

  ### Сколько учиться до работы?
  До оператора на серийной детали — 3–6 месяцев теории и практики. До наладчика 4-го разряда, который сам ставит деталь с нуля, — год-два в цеху. Дальше — сложность деталей и многоосевая обработка.
