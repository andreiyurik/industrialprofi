tagline: "Дорога служит двадцать лет или три — решает смена, которая её уложила."
about: |
  Дорожный строитель делает то, чем каждый день пользуются все и о чём вспоминают, только когда плохо: полосу, по которой едут скорая, пожарная машина, школьный автобус и фура со снабжением района. Для тысяч посёлков дорога — единственная связь с районной больницей, школой и работой, и когда её нет или она разбита, отменяется не поездка, а доступ к медицине и заработку. Это одна из немногих рабочих профессий, где результат смены остаётся частью инфраструктуры страны на десятилетия.

  Работа — не «асфальт сверху», а конструкция из слоёв: грунт земляного полотна, дренаж и водоотвод, основание, покрытие. Дорожный строитель делает разбивку и профиль, уплотняет грунт до проектной плотности, отводит воду, укладывает и уплотняет асфальтобетон в температурном режиме, держит швы и примыкания, отбирает керны и подписывает исполнительную документацию — и всё это в метре от идущего потока, где схема ограждения места работ важна не меньше технологии. Большую часть карьеры занимает не новое строительство, а ремонт и содержание уже готовой дороги: диагностика, фрезерование, ямочный ремонт, разметка, зимняя борьба со льдом.

  Цена ошибки здесь отложена во времени и измеряется не деньгами. Недобрал два процента плотности — через пять лет колея; в колее стоит вода; на воде аквапланирование на скорости 90 км/ч. Дефект дороги отличается от большинства строительных тем, что последствие движется по нему на скорости. Поэтому за каждой темой карты — грунтом, битумом, температурой укладки, лабораторным протоколом — стоит не абстрактное «качество», а конкретный отказ конструкции и человек за рулём.

  В России путь описан профстандартами: дорожный рабочий (804н/2020), машинисты катка, автогрейдера и асфальтоукладчика (476н, 581н, 610н/2021), специалист по организации строительства объектов дорожного хозяйства (182н/2023) — ближайший формальный аналог должности дорожного мастера. Стать лучшим машинистом катка на участке и стать мастером — обе траектории рабочие, ни одна не тупик. Карта ведёт от физики грунта до организации участка.
highlights:
  - "**Читает проектный профиль и делает разбивку:** отметки, уклоны, поперечник — до того, как на участок зайдёт техника"
  - "**Уплотняет по науке, а не «на глаз»:** кривая Проктора, оптимальная влажность, число проходов, контроль плотности в поле"
  - "**Отводит воду:** дренаж, водоотвод, защита от морозного пучения — это решает судьбу дороги сильнее, чем марка асфальта"
  - "**Укладывает асфальтобетон в режиме:** температура смеси, скорость укладчика, схема проходов катка, швы и примыкания"
  - "**Доказывает качество, а не заявляет его:** отбор кернов, испытания, исполнительная документация, приёмка по СП 78.13330"
  - "**Содержит и ремонтирует дорогу:** диагностика дефектов, фрезерование, ямочный ремонт, разметка, зимнее содержание"
pros:
  - "Общественная значимость видна без объяснений: по полосе, которую ты уложил, поедут скорая, школьный автобус и снабжение района"
  - "Работа не заканчивается вместе со стройкой: дорожная сеть требует содержания и ремонта каждый год, независимо от нового строительства"
  - "Результат осязаем и долговечен — участок стоит десятилетиями, и его видно с дороги"
  - "Вход без высшего образования: разряд получают по факту освоенных работ, рост измерим профстандартами"
  - "Нормативы открыты: СП, ГОСТ и профстандарты доступны бесплатно — учиться можно до трудоустройства"
cons:
  - "Сезонный пик: укладка идёт в тёплое окно, поэтому летом смены по 10–12 часов, ночные работы и выходные — норма"
  - "Тяжёлые условия: жара над горячей смесью, дождь, битумные пары, пыль, шум техники"
  - "Работа рядом с движущимся потоком: место работ ограждено, но машины идут в метре — это реальный, а не бумажный риск"
  - "Вахты и командировки: трасса проходит не по городу, и объект может увести от дома на месяцы"
  - "Качество зависит не только от тебя: срезанную толщину основания решают выше по цепочке, а трещину увидят на твоём участке"
history: |
  Дорога — одна из старейших инженерных конструкций, и её главный принцип не менялся. Римская Аппиева дорога, начатая в 312 году до н. э., строилась слоями с водоотводом: не покрытие, а пирог, из которого уходит вода. Через две тысячи лет шотландцы Томас Телфорд и Джон Мак-Адам сформулировали то же самое для эпохи гужевого транспорта — фракционно подобранный щебень, выпуклое полотно, дренаж. Слово «макадам» осталось в языке; когда в щебень добавили дёготь, а затем битум, родился асфальтобетон, которым сегодня покрыто большинство дорог мира.

  В России первое шоссе с твёрдым покрытием связало Петербург и Москву к 1834 году, а массовым дорожное строительство стало в советские десятилетия — вместе с системой ГОСТов, разрядов и дорожно-строительных управлений. Последние тридцать лет изменили не физику, а точность: американский Superpave и немецкие RStO и ZTV Asphalt-StB привязали состав смеси и толщину одежды к реальной нагрузке и климату, а GPS-нивелирование и интеллектуальное уплотнение с датчиками на катке превратили «сколько проходов положено» в измеряемую карту плотности.
faq: |
  ### Нужно ли образование, чтобы начать?
  Нет. На объект приходят учеником или дорожным рабочим, а разряд по профстандарту 804н получают по факту освоенных работ. На технику — каток, асфальтоукладчик, автогрейдер — нужно удостоверение машиниста и отдельное обучение. Диплом техникума или инженера-дорожника начинает работать на уровне мастера и прораба, где появляются проектная документация и ответственность за приёмку. Карта даёт теорию и нормативы, чтобы ученик понимал, что делает, а не только держал лопату.

  ### Дороги разрушаются из-за климата или из-за работы?
  Из-за обоих, но не поровну. Цикл замерзания-оттаивания и морозное пучение — реальная физика, и в Финляндии с Канадой она не мягче. Разница в том, что там её закладывают в конструкцию: дренаж, морозозащитный слой, правильный грунт под насыпью. Большинство ранних разрушений объясняются не морозом как таковым, а водой, которую не отвели, и плотностью, которую не добрали. Ровно об этом первые две главы карты.

  ### Работа сезонная?
  Укладка — да: температурный режим смеси не позволяет класть покрытие в дождь и мороз, поэтому тёплый сезон идёт на пределе. Но отрасль работает круглый год: зимой — содержание, борьба со льдом, ремонт техники и подготовка к сезону. Для одних это плюс (зимой спокойнее), для других минус (заработок по сезонам неравномерный).

  ### Заменит ли техника дорожного рабочего?
  Часть операций уже заменила: 3D-нивелирование ведёт автогрейдер по цифровой модели, датчики на катке показывают плотность в реальном времени. Но машина не объясняет, почему участок не набирает плотность, не видит переувлажнённый грунт под насыпью и не отвечает за приёмку. Автоматизация поднимает планку квалификации, а не отменяет её — и в отрасли не хватает как раз не рук, а людей, понимающих технологию.

  ### Сколько зарабатывает дорожный строитель?
  Зависит от региона, роли (рабочий, машинист, мастер), формы работы — местное ДРСУ или вахта на федеральной трассе — и от сезона, поэтому цифр мы не публикуем: они устаревают быстрее статьи. Посмотрите свежие вакансии по своему региону, это честнее любого среднего.
