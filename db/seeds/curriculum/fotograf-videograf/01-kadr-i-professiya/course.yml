description: "Неприятная правда в начале пути: кадры, от которых захватывает дух, делаются не камерой. Разбираем анатомию сильного кадра, вскрываем механику рынка фототехники и договариваемся об учебном инструменте — критерий подходящей камеры и словарь перевода маркетинговых имён в физику."
