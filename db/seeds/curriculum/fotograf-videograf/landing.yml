about: |
  Это карта увлечения, а не профессии. Фото и видео здесь — способ отдыхать, смотреть внимательнее и делиться увиденным: прогулка с камерой, семейный архив, который не стыдно пересматривать, репортаж с объекта или из цеха. Камера — инструмент; ремесло — в понимании света, оптики, экспозиции, композиции и монтажа. Именно оно отличает случайный кадр от того, который хочется показать.

  Для инженера и мастера это ещё и инструмент публичности. Снятый по-человечески щит, шов, станок или готовое изделие рассказывает о квалификации лучше строчки в резюме; портфолио работ, короткое видео процесса, понятный кадр для объявления или статьи — то, что отличает специалиста, которого находят, от того, кого не видно. Те же навыки продают и собственную продукцию — без студии и агентства.

  Карта выстроена как ремесло, а не как набор лайфхаков: от физики света и зрения через оптику, камеру, экспозицию и композицию к постпродакшну — чтобы понимать, почему кадр получился, и уметь повторить. Снимать можно тем, что уже в кармане; темп — твой, экзаменов нет.
highlights:
  - "**Видит свет раньше камеры:** направление, жёсткость, цветовая температура — на прогулке, в цеху, дома у окна"
  - "**Понимает оптику:** фокусное, диафрагма, глубина резкости — и выбирает объектив под задачу, а не под моду"
  - "**Измеряет экспозицию,** а не угадывает: гистограмма, замер, ISO — осознанно, на любой камере, включая телефон"
  - "**Строит кадр** по правилам композиции и против них — чтобы деталь, изделие или человек читались с первого взгляда"
  - "**Снимает свою работу честно и понятно:** щит, шов, станок, объект — так, что по кадру видна квалификация"
  - "**Доводит до результата:** RAW и цвет, звук в видео, архив и бэкап — кадр не заканчивается на спуске затвора"
pros:
  - "Начать можно сегодня и с телефона — порог входа почти нулевой"
  - "Отдых, который возвращает внимание: прогулка с камерой заставляет смотреть, а не листать"
  - "Усиливает тебя как специалиста: хорошо снятая работа продаёт квалификацию и продукцию без лишних слов"
  - "Семейный архив, за который через двадцать лет скажут спасибо"
  - "Ремесло глубокое и не устаревает: свет и композиция те же, что сто лет назад"
cons:
  - "Техника затягивает: легко уйти в покупку объективов вместо съёмки"
  - "Хороший кадр — это время: свет надо ждать, архив — разбирать, видео — монтировать"
  - "Без практики знания выветриваются: карта даёт базу, глаз ставится только съёмкой"
  - "Публичность обязывает: выложенный кадр работы смотрят коллеги и заказчики — халтура видна сразу"
  - "Как заработок это отдельная дорога с нестабильным доходом — о ней здесь только последняя глава"
history: |
  Первую сохранившуюся фотографию Жозеф Ньепс сделал в 1826–1827 годах с выдержкой в несколько часов; дагеротип, объявленный в 1839-м, сделал съёмку делом минут, а камера Kodak 1888 года («вы нажимаете кнопку — остальное делаем мы») превратила её в массовое увлечение. Leica 1925 года принесла 35-мм плёнку и репортаж, а кино с 1895-го росло рядом как ремесло движущегося кадра.

  Цифра с конца 1990-х убрала плёнку, но не ремесло; зеркалки 2008 года научились снимать видео, и фото с видео стали одним навыком. Сегодня камера у каждого в кармане — и именно поэтому ценится тот, кто понимает свет и кадр, а не просто владеет техникой.
faq: |
  ### Это карта профессии или увлечения?
  Увлечения. Карта учит ремеслу фото и видео так же всерьёз, как другие карты учат профессиям, но не обещает карьеру: для большинства читателей это отдых, семейный архив и способ показать свою работу. Если захочется зарабатывать — база та же, а дорога описана в главе «Рост и ремесло».

  ### Зачем инженеру или мастеру уметь снимать?
  Потому что о твоей работе судят по кадру: фото щита или шва в портфолио, короткое видео наладки, понятный снимок изделия для объявления или статьи. Это самый дешёвый способ быть заметным специалистом — и он полностью в твоих руках.

  ### Какую камеру купить для начала?
  Ту, что уже есть, — хотя бы телефон. Первые главы про свет, оптику и экспозицию одинаковы для любой камеры; когда поймёшь, чего не хватает, выбор техники станет очевидным. Карта нарочно откладывает разговор о брендах.

  ### Фото или видео — что учить?
  База общая: свет, оптика, экспозиция, композиция. Видео добавляет движение, звук и монтаж. Карта идёт от общего к частному, и к развилке ты подойдёшь с пониманием, что тебе ближе.

  ### Сколько времени это занимает?
  Сколько дашь: глава — вечер, практика — прогулка. Здесь нет сроков и экзаменов; единственное правило — снимать регулярно и разбирать, почему кадр получился или нет.
