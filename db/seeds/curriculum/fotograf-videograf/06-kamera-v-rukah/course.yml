title: "Камера в руках: протокол, фокус, движение"
slug: "fv-kamera-v-rukah"
description: "Объём знаний о конкретной камере конечен и невелик — эта глава закрывает его протоколом из четырёх шагов и больше к технике не возвращается. Плюс то, что делается руками: ручной фокус как основной инструмент, зонная фокусировка, опора и движение камеры, у которого есть мотив."
