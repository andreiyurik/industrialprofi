title: "Камера как коробка: от фотона к файлу"
slug: "fv-kamera-korobka"
description: "Светонепроницаемая коробка с отверстием — конструкция, не менявшаяся с 1839 года; менялся только приёмник. Как матрица превращает фотоны в числа, откуда берётся шум и динамический диапазон, что такое мозаика Байера и «цветовая наука» бренда, зачем десятый бит и чем опасен электронный затвор."
