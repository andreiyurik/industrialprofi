description: "Единственная часть техники, которая напрямую видна в кадре. Что из трёх параметров вообще является экспозицией, зачем правило 180° и ND-фильтр, как читать waveform и зебру вместо «на глаз по экрану», когда нужен log — и как измерить границы собственной камеры вместо веры обзорам."
