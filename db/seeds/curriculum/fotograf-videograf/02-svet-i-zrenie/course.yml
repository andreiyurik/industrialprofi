title: "Свет и зрение: что мы вообще снимаем"
slug: "fv-svet-i-zrenie"
description: "Снимаем мы свет, а камера — всего лишь прибор для его записи, поэтому свет идёт раньше прибора. Четыре свойства света, спектр и цветовая температура, сколько света физически есть в типовых сценах — и почему собственный глаз систематически врёт, из-за чего и понадобились приборы."
