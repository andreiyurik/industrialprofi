description: "Кадры сами по себе ещё не высказывание. Как предвидеть момент вместо реакции на него, зачем длинный статичный план, как из отдельных кадров складывается сюжет, как пишется план документальной съёмки, как снимать интервью — и что закон разрешает снимать в России."
