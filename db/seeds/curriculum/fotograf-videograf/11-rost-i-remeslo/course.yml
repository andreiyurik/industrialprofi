description: "Техника конечна, глаз растёт всю жизнь — но только осознанной практикой с обратной связью. Как устроен личный план роста, где брать живую критику и как её принимать, из чего собирается портфолио на двенадцать работ, что покупает заказчик и как считать деньги. Заканчивается выпускной работой."
