title: "Охота за светом"
slug: "fv-ohota-za-svetom"
description: "Сердце пути. Почему низкое солнце физически другое, как облачность по ярусам делает или убивает закат, как рассчитать по эфемеридам, где будет солнце в нужный день и час, — и как работать с одним источником, от окна до прибора. Свет ищут и планируют, а не настраивают."
