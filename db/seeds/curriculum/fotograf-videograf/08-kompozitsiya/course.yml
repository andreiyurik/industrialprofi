title: "Кадр: композиция как наука"
slug: "fv-kompozitsiya"
description: "Композиция — не набор правил вроде «третей», а управление вниманием зрителя. Разбираем язык визуальной структуры: контраст и аффинность по семи компонентам, линии, ритм и слои, цвет как инструмент, точка съёмки — и ограничение как самый быстрый способ научиться видеть."
